<title>Prototipe Pesan QR Lifestore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Lifestore design system v3: hidup, modern, pastel per kategori, kartu bulat, tombol pil. */
:root{
  --bg:#eef3f1;--surface:#ffffff;--surface-2:#f4f7f6;--line:#e6ecea;--line-strong:#d3dcd9;
  --fg:#14201c;--muted:#64736d;--faint:#9aa8a2;
  --accent:#0f9f7f;--accent-ink:#fff;--accent-soft:#dff5ee;--accent-strong:#0b7d64;--ink:#14201c;
  --warn:#c27803;--warn-soft:#fff1d6;--danger:#e0445c;--danger-soft:#ffe3e8;--ok:#16a34a;--ok-soft:#dcfce7;--info:#2f6fe4;--info-soft:#e0ebff;
  --radius:20px;--radius-md:14px;--radius-sm:10px;
  --shadow:0 1px 2px rgba(16,40,32,.04),0 10px 30px rgba(16,40,32,.07);
  --shadow-lg:0 2px 6px rgba(16,40,32,.08),0 18px 44px rgba(16,40,32,.18);
  --c-peach:#ffd9c2;--c-lemon:#fff0b3;--c-sky:#cfe6ff;--c-lilac:#e6d9ff;--c-mint:#c9f2df;--c-pink:#ffd6e7;--c-sand:#efe4d6;--on-pastel:#14201c;
  --blob:40%;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --top:calc(60px + env(safe-area-inset-top,0px));--col:430px;
  color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1211;--surface:#181c1b;--surface-2:#202625;--line:#2a3230;--line-strong:#37413e;
  --fg:#eef3f1;--muted:#9eaca7;--faint:#6b7873;
  --accent:#34d3a6;--accent-ink:#06261d;--accent-soft:#143a30;--accent-strong:#5fe0bb;--ink:#eef3f1;
  --warn:#f5b54a;--warn-soft:#3a2c10;--danger:#ff7b8f;--danger-soft:#3d1a21;--ok:#4ade80;--ok-soft:#123222;--info:#7fa8ff;--info-soft:#16264a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--shadow-lg:0 2px 6px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.55);
  --blob:9%;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1211;--surface:#181c1b;--surface-2:#202625;--line:#2a3230;--line-strong:#37413e;
  --fg:#eef3f1;--muted:#9eaca7;--faint:#6b7873;
  --accent:#34d3a6;--accent-ink:#06261d;--accent-soft:#143a30;--accent-strong:#5fe0bb;--ink:#eef3f1;
  --warn:#f5b54a;--warn-soft:#3a2c10;--danger:#ff7b8f;--danger-soft:#3d1a21;--ok:#4ade80;--ok-soft:#123222;--info:#7fa8ff;--info-soft:#16264a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);--shadow-lg:0 2px 6px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.55);
  --blob:9%;color-scheme:dark}

/* ---------- Dasar ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
@media (min-width:600px){body{background:
  radial-gradient(560px 440px at 6% 10%,color-mix(in srgb,var(--c-peach) var(--blob),transparent),transparent 70%),
  radial-gradient(560px 440px at 94% 26%,color-mix(in srgb,var(--c-sky) var(--blob),transparent),transparent 70%),
  radial-gradient(600px 460px at 14% 92%,color-mix(in srgb,var(--c-lilac) var(--blob),transparent),transparent 70%),
  radial-gradient(560px 440px at 90% 96%,color-mix(in srgb,var(--c-mint) var(--blob),transparent),transparent 70%),var(--bg);background-attachment:fixed}}
#app{max-width:var(--col);margin:0 auto;padding:calc(var(--top) + 8px) 16px calc(124px + env(safe-area-inset-bottom,0px));min-height:100vh}
h1,h2,h3,p{margin:0}
h1{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
h2{font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.25}
h3{font-size:15px;font-weight:600;line-height:1.3}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.fine{font-size:12px;color:var(--faint)}
.grow{flex:1;min-width:0}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.center{text-align:center}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mt32{margin-top:32px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
button,a,.tile,.mcard,.a-item{transition:transform .15s ease,background-color .15s ease,box-shadow .15s ease,color .15s ease}
button:active:not(:disabled){transform:scale(.98)}

/* ---------- Tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--surface-2);color:var(--fg);font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover:not(:disabled){background:color-mix(in srgb,var(--surface-2) 80%,var(--fg) 8%)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover:not(:disabled){background:var(--accent-strong)}
.btn.primary:disabled{box-shadow:none;background:color-mix(in srgb,var(--accent) 45%,var(--surface-2));opacity:1;color:var(--accent-ink)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.ink:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 88%,var(--accent))}
.btn.outline{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.btn.big{min-height:54px;font-size:16px;padding:0 22px}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.demo{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong);color:var(--muted);font-weight:500;border:0;background-image:none;outline-offset:2px}
.btn.demo{border:1.5px dashed var(--line-strong);box-shadow:none}
.ibtn{width:44px;height:44px;flex:none;display:inline-grid;place-items:center;border-radius:50%;background:var(--surface);color:var(--fg);box-shadow:var(--shadow);position:relative}
.ibtn.flat{box-shadow:none;background:var(--surface-2)}
.ibtn .bdg{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.link{color:var(--accent-strong);font-weight:600;display:inline-flex;align-items:center;gap:4px;min-height:36px;font-size:14px}
.link svg.i{width:16px;height:16px}
.back{display:inline-flex;align-items:center;gap:10px;font-weight:600;min-height:44px;color:var(--fg)}
.back .ibtn{width:40px;height:40px}

/* ---------- Kartu, pil status, banner ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted);line-height:1}
.pill svg.i{width:14px;height:14px;stroke-width:2.2}
.pill.acc{background:var(--accent-soft);color:var(--accent-strong)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.inkp{background:var(--ink);color:var(--bg)}
.pill.promo{background:var(--danger);color:#fff}
.pill.lg{height:30px;padding:0 12px;font-size:13px}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--radius-md);background:var(--surface-2);font-size:14px;line-height:1.45}
.banner .bi{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--surface)}
.banner.warn{background:var(--warn-soft);color:var(--fg)} .banner.warn .bi{background:var(--warn);color:#fff}
.banner.acc{background:var(--accent-soft);color:var(--fg)} .banner.acc .bi{background:var(--accent);color:var(--accent-ink)}
.banner b{font-weight:700}
.notes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.notes li{display:flex;gap:10px;align-items:flex-start}
.notes li span:first-child{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;display:inline-block}
.dot.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.note{font-size:13px;color:var(--muted);font-style:italic}
.sub{font-size:13px;color:var(--muted)}

/* Visual emoji (pengganti foto) */
.th{display:grid;place-items:center;flex:none;background:var(--p,var(--c-sand));border-radius:var(--radius-md);line-height:1;user-select:none;position:relative}
.th.s32{width:32px;height:32px;font-size:17px;border-radius:10px}
.th.s44{width:44px;height:44px;font-size:24px;border-radius:12px}
.th.s56{width:56px;height:56px;font-size:30px}
.th.s64{width:64px;height:64px;font-size:34px;border-radius:16px}
.th.s88{width:88px;height:88px;font-size:46px;border-radius:18px}
.habis .em{filter:grayscale(1);opacity:.55}
.price{display:inline-flex;gap:6px;align-items:baseline;font-weight:700}
.price s{color:var(--faint);font-size:12px;font-weight:500}
.price .pr{color:var(--danger)}

/* Input */
input.in,textarea.in{width:100%;font:inherit;font-size:15px;color:var(--fg);background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--radius-md);padding:11px 14px;min-height:46px;resize:vertical}
input.in::placeholder,textarea.in::placeholder{color:var(--faint)}
input.in:focus-visible,textarea.in:focus-visible{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.lbl{font-size:14px;font-weight:600}

/* Kontrol segmen */
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;min-height:38px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(16,40,32,.08),0 4px 12px rgba(16,40,32,.08)}
.seg.ink button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .c{opacity:.6;font-weight:500;margin-left:2px}

/* ---------- Header sambutan ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px;background:linear-gradient(135deg,var(--accent-soft) 0%,var(--surface) 75%);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero .deco{position:absolute;right:-14px;top:40px;display:grid;grid-template-columns:repeat(2,52px);gap:8px;transform:rotate(-12deg);pointer-events:none}
.hero .deco span{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--p)}
.hero .deco span:nth-child(2){margin-top:22px}
.hero .deco span:nth-child(3){margin-top:-12px}
.hero-top{display:flex;align-items:center;gap:10px;position:relative}
.logo{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:19px;flex:none;box-shadow:0 6px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.hero-top b{display:block;font-weight:700;font-size:15px;line-height:1.2}
.hero-top .muted{font-size:12px}
.meja{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:13px;white-space:nowrap}
.meja svg.i{width:15px;height:15px}
.hero h1{margin-top:16px;position:relative;max-width:78%}
.hero p.lead{margin-top:6px;color:var(--muted);font-size:14px;position:relative;max-width:72%}
.hero .acts{display:flex;gap:8px;margin-top:16px;position:relative;flex-wrap:wrap}
.callpill{display:flex;align-items:center;gap:10px;margin-top:12px;padding:8px 8px 8px 14px;border-radius:999px;font-size:13px;background:var(--warn-soft);color:var(--fg);font-weight:500}
.callpill .dot{background:var(--warn)}
.callpill .btn{margin-left:auto;background:var(--surface)}

/* Promo Happy Hour */
.promo{display:flex;align-items:center;gap:14px;margin-top:16px;padding:12px 14px;border-radius:var(--radius);background:var(--c-sky);color:var(--on-pastel);position:relative;overflow:hidden}
.promo .e{font-size:34px;line-height:1;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;flex:none}
.promo b{display:block;font-weight:800;font-size:15px}
.promo span.s{font-size:13px;opacity:.75}
.promo .off{margin-left:auto;font-weight:800;font-size:20px;background:var(--on-pastel);color:#fff;border-radius:14px;padding:8px 10px;flex:none;letter-spacing:-.02em}

/* Status pesanan terakhir */
.peek{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px 12px 12px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left}
.peek .grow b{display:block;font-weight:700}

/* ---------- Strip atas: Demo + pemilih variasi ---------- */
.topstrip{position:fixed;top:0;left:0;right:0;max-width:var(--col);margin:0 auto;height:var(--top);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:60}
.pillbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1.5px dashed var(--line-strong);border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface)}
.pillbtn[aria-expanded="true"]{border-style:solid;border-color:var(--accent);color:var(--fg)}
.switcher{display:inline-flex;align-items:center;height:38px;padding:3px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:13px;max-width:calc(100% - 100px);box-shadow:var(--shadow)}
.switcher button{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:18px;line-height:1;flex:none}
.switcher button:hover{background:color-mix(in srgb,var(--bg) 18%,transparent)}
.switcher span{padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.demo-panel{position:fixed;top:calc(var(--top) + 4px);left:max(16px,calc(50% - var(--col)/2 + 16px));width:min(310px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);padding:16px;z-index:70;font-size:14px;max-height:calc(100vh - var(--top) - 16px);overflow:auto}
.demo-panel .dbtn{display:flex;width:100%;align-items:center;min-height:42px;padding:0 14px;margin-top:6px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14px}
.demo-panel .dbtn:disabled{opacity:.4}
.demo-panel .dbtn.dash{background:transparent;border:1.5px dashed var(--line-strong);color:var(--muted)}
.switch{display:flex;justify-content:space-between;align-items:center;min-height:42px;width:100%;margin-top:6px;padding:0 4px 0 14px;font-weight:600}
.switch .track{width:44px;height:26px;border-radius:999px;background:var(--line-strong);position:relative;flex:none;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .track::after{transform:translateX(18px)}

/* ---------- Bilah bawah: pil tinta keranjang ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;max-width:var(--col);margin:0 auto;padding:20px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 55%,color-mix(in srgb,var(--bg) 0%,transparent));z-index:40;display:flex;gap:8px;pointer-events:none}
.bar>*{pointer-events:auto}
.bar .btn{flex:1;min-width:0;padding:0 12px}
.cartbar{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 10px 8px 8px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-lg);text-align:left}
.cartbar .cnt{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;position:relative}
.cartbar .cnt svg.i{width:20px;height:20px}
.cartbar .cnt b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid var(--ink)}
.cartbar .t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.cartbar .t b{font-weight:700;font-size:15px}
.cartbar .t span{font-size:12px;opacity:.65}
.cartbar .amt{margin-left:auto;font-weight:800;font-size:17px;white-space:nowrap}
.cartbar .go{width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--bg) 14%,transparent);display:grid;place-items:center;flex:none}
.hintbar{margin:0 auto;padding:10px 16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;color:var(--muted);font-weight:500}

/* ---------- Panel pesanan (keranjang, tagihan) ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.panel-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.olines{list-style:none;margin:0;padding:0}
.oline{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px dashed var(--line-strong);align-items:start}
.oline:last-child{border-bottom:0}
.oline .nm{font-weight:700;font-size:15px;line-height:1.3}
.oline .lp{font-weight:800;white-space:nowrap}
.oline .ctl{grid-column:2/4;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2);color:var(--fg)}
.stepper button:last-child{background:var(--ink);color:var(--bg)}
.stepper button svg.i{width:18px;height:18px;stroke-width:2.2}
.stepper button.del{color:var(--danger);background:var(--danger-soft)}
.stepper span{min-width:22px;text-align:center;font-weight:800;font-size:16px}
.totals{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0;font-size:14px}
.totals dt{color:var(--muted)} .totals dd{margin:0;text-align:right;font-weight:600}
.grand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:14px;padding-top:14px;border-top:2px dashed var(--line-strong)}
.grand span{font-weight:700;font-size:15px}
.grand b{font-weight:800;font-size:28px;letter-spacing:-.025em;white-space:nowrap}
.addmore{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;margin-top:4px;border-radius:999px;border:1.5px dashed var(--line-strong);color:var(--muted);font-weight:600;font-size:14px}
.addmore:hover{border-color:var(--accent);color:var(--accent-strong)}
.empty{min-height:42vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
.empty .big{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:var(--p,var(--surface-2))}

/* ---------- Konfigurasi menu ---------- */

/* ---------- Sheet, layar penuh, toast ---------- */

.cd{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--line)}

/* ============ Variasi A: daftar bergulir ============ */

.b-card{flex:0 0 82%;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}

.c-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.hcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-top:14px}
.hcard-hd{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.hcard-hd .th{border-radius:50%}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}button:active:not(:disabled){transform:none}}
</style>

<div class="topstrip">
  <button class="pillbtn" id="demoBtn" aria-expanded="false" aria-controls="demo">⚙︎ Demo</button>
  <nav class="switcher" aria-label="Pilih variasi prototipe">
    <button id="prev" aria-label="Variasi sebelumnya">‹</button>
    <span id="vlabel"></span>
    <button id="next" aria-label="Variasi berikutnya">›</button>
  </nav>
</div>
<div id="demo" class="demo-panel" hidden></div>
<main id="app"></main>
<div id="layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ===================== Data contoh ===================== */
const OUTLET = {name:"Warung Daun", area:"Kemang", meja:"A3"};
const SERVICE = 0.05, PBJT = 0.10, QRIS_MS = 10*60*1000;
const STAT = ["Diterima","Dimasak","Siap","Diantar"];
const REASONS = ["Minta alat makan","Minta air","Lainnya"];
const CATS = [
  {id:"utama", name:"Makanan utama", desc:"Nasi, mie, dan lauk"},
  {id:"camilan", name:"Camilan", desc:"Untuk berbagi"},
  {id:"minuman", name:"Minuman", desc:"Dingin dan hangat"},
  {id:"penutup", name:"Penutup", desc:"Yang manis-manis"},
];
const PEDAS = {name:"Level pedas", opts:[{n:"Tidak pedas"},{n:"Sedang"},{n:"Pedas"},{n:"Extra pedas"}]};
const TAMBAH = {id:"g-tambah", name:"Tambahan", min:0, max:3, opts:[{id:"a-telur",n:"Telur ceplok",p:5000},{id:"a-kerupuk",n:"Kerupuk udang",p:3000},{id:"a-sate",n:"Sate ayam 2 tusuk",p:12000}]};
const MENU = [
  {id:"m1",cat:"utama",name:"Nasi Goreng Daun",desc:"Nasi goreng kampung, daun jeruk, acar timun.",price:35000,varian:PEDAS,groups:[TAMBAH]},
  {id:"m2",cat:"utama",name:"Ayam Bakar Madu",desc:"Ayam kampung bakar, lalapan, nasi putih.",price:42000,
    varian:{name:"Bagian",opts:[{n:"Paha"},{n:"Dada",p:3000}]},
    groups:[{id:"g-sambal",name:"Sambal",min:1,max:2,opts:[{id:"s-matah",n:"Sambal matah",p:0},{id:"s-terasi",n:"Sambal terasi",p:0},{id:"s-ijo",n:"Sambal ijo",p:2000}]}]},
  {id:"m3",cat:"utama",name:"Mie Goreng Jawa",desc:"Mie telur, sawi, kol, bawang goreng.",price:30000,varian:PEDAS,groups:[TAMBAH]},
  {id:"m4",cat:"utama",name:"Sop Buntut",desc:"Kuah bening, wortel, kentang, emping.",price:68000,groups:[{id:"g-nasi",name:"Pelengkap",min:0,max:1,opts:[{id:"n-putih",n:"Nasi putih",p:6000},{id:"n-merah",n:"Nasi merah",p:8000}]}]},
  {id:"m5",cat:"utama",name:"Gado-gado",desc:"Sayur rebus, lontong, bumbu kacang.",price:28000,habis:true},
  {id:"m6",cat:"camilan",name:"Tahu Cabe Garam",desc:"Tahu sutra goreng, cabai, daun bawang.",price:22000},
  {id:"m7",cat:"camilan",name:"Pisang Goreng Keju",desc:"Pisang kepok, keju parut, susu kental.",price:24000,groups:[{id:"g-top",name:"Topping",min:0,max:2,opts:[{id:"t-keju",n:"Keju ekstra",p:5000},{id:"t-coklat",n:"Cokelat",p:4000}]}]},
  {id:"m8",cat:"camilan",name:"Kentang Goreng",desc:"Potongan tebal, saus sambal.",price:20000},
  {id:"m9",cat:"minuman",name:"Es Teh",desc:"Teh melati seduh.",price:8000,varian:{name:"Rasa",opts:[{n:"Manis"},{n:"Less sugar"},{n:"Tawar"}]}},
  {id:"m10",cat:"minuman",name:"Kopi Susu Gula Aren",desc:"Espresso, susu segar, gula aren.",price:22000,varian:{name:"Penyajian",opts:[{n:"Es"},{n:"Panas"}]},
    groups:[{id:"g-kopi",name:"Ekstra",min:0,max:2,opts:[{id:"k-shot",n:"Extra shot",p:6000},{id:"k-oat",n:"Ganti oat milk",p:8000}]}]},
  {id:"m11",cat:"minuman",name:"Es Jeruk",desc:"Jeruk peras segar.",price:14000},
  {id:"m12",cat:"minuman",name:"Air Mineral",desc:"Botol 600 ml.",price:6000},
  {id:"m13",cat:"penutup",name:"Es Cendol",desc:"Cendol pandan, santan, gula merah.",price:18000},
  {id:"m14",cat:"penutup",name:"Klepon",desc:"Isi gula merah, kelapa parut. 5 butir.",price:15000},
];
const M = id => MENU.find(m=>m.id===id);
const CAT = id => CATS.find(c=>c.id===id);

/* ===================== Logika (state + fungsi murni) ===================== */
let uid = 0; const nid = p => p + (++uid);
function freshState(keep={}){
  return {
    mode: keep.mode || "akhir",           // "akhir" | "dulu", diatur per Outlet
    paused: false, happy: true,           // Kasir offline -> QR dijeda; promo Happy Hour aktif
    confirmed: false,                     // Konfirmasi Staf untuk sesi ini
    cart: [], orderNote: "",              // keranjang milik HP ini saja
    orders: [], orderNo: 0,               // Pesanan di Tagihan meja ini (semua HP)
    call: null, callDraft: {reason:null, other:""},
    billRequested: false, closed: false,
    email: "", emailSaved: false,
    sheet: null, cfg: null, qris: null,
    ui: {A:{view:"menu",cat:"utama"}, B:{step:"home",cat:null}, C:{tab:"menu",q:"",cat:"semua"}},
  };
}
let S = freshState();

const rp = n => "Rp " + Math.round(n).toLocaleString("id-ID");
const jam = d => d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
const isPromo = m => S.happy && m.cat==="minuman";
const basePrice = m => isPromo(m) ? Math.round(m.price*0.8) : m.price;

function unitPrice(l){
  const m = M(l.menu); let p = basePrice(m);
  if(m.varian && l.varian!=null) p += m.varian.opts[l.varian].p || 0;
  (m.groups||[]).forEach(g=>g.opts.forEach(o=>{ if(l.addons.includes(o.id)) p += o.p; }));
  return p;
}
const lineTotal = l => (l.unit ?? unitPrice(l)) * l.qty;
function calc(lines){
  const sub = lines.reduce((s,l)=>s+lineTotal(l),0);
  const svc = Math.round(sub*SERVICE);          // dine-in
  const tax = Math.round((sub+svc)*PBJT);       // PBJT atas subtotal + service
  return {sub, svc, tax, total: sub+svc+tax};
}
function lineDesc(l){
  const m = M(l.menu), out = [];
  if(m.varian && l.varian!=null) out.push(m.varian.opts[l.varian].n);
  (m.groups||[]).forEach(g=>g.opts.forEach(o=>{ if(l.addons.includes(o.id)) out.push(o.n); }));
  return out.join(" · ");
}
const cartCount = () => S.cart.reduce((s,l)=>s+l.qty,0);

/* Konfigurasi item: varian (pilih satu) + grup pilihan (min/max) + catatan */
function openCfg(id){ const m=M(id); if(!m || m.habis) return false; S.cfg={menu:id, varian:m.varian?0:null, addons:[], note:"", qty:1}; return true; }
const groupCount = g => g.opts.filter(o=>S.cfg.addons.includes(o.id)).length;
const cfgShort = () => (M(S.cfg.menu).groups||[]).filter(g=>groupCount(g)<g.min);
function toggleAddon(gid, oid){
  const g = M(S.cfg.menu).groups.find(x=>x.id===gid);
  if(S.cfg.addons.includes(oid)){ S.cfg.addons = S.cfg.addons.filter(x=>x!==oid); return; }
  if(g.max===1) S.cfg.addons = S.cfg.addons.filter(x=>!g.opts.some(o=>o.id===x));
  else if(groupCount(g)>=g.max) return;
  S.cfg.addons.push(oid);
}
const cfgUnit = () => unitPrice(S.cfg);
function addCfgToCart(){
  if(!S.cfg || cfgShort().length) return false;
  const c = S.cfg, key = l => [l.menu,l.varian,[...l.addons].sort().join(","),l.note.trim()].join("|");
  const same = S.cart.find(l=>key(l)===key(c));
  if(same) same.qty += c.qty; else S.cart.push({u:nid("l"), menu:c.menu, varian:c.varian, addons:[...c.addons], note:c.note.trim(), qty:c.qty});
  S.cfg = null; return true;
}
function cartQty(u, d){ const l=S.cart.find(x=>x.u===u); if(!l) return; l.qty+=d; if(l.qty<=0) S.cart=S.cart.filter(x=>x!==l); }

/* Pesanan dan Tagihan */
function placeOrder(by, lines, note, paid){
  const waiting = !S.confirmed;
  const o = {id:nid("o"), no:++S.orderNo, by, note, at:new Date(), waiting, needConfirm:waiting, paid, prepaid:paid,
    lines: lines.map(l=>({...l, addons:[...l.addons], unit:unitPrice(l), st:0}))};
  S.orders.push(o); S.billRequested = false; return o;
}
function submitCart(){
  if(!S.cart.length || S.paused || S.closed) return null;
  if(S.mode==="dulu"){ startQris("dulu", calc(S.cart).total); return {qris:true}; }
  const o = placeOrder("me", S.cart, S.orderNote, false); S.cart=[]; S.orderNote=""; return {order:o};
}
const orderStage = o => o.waiting ? -1 : Math.min(...o.lines.map(l=>l.st));
const stageLabel = o => o.waiting ? "Menunggu konfirmasi staf" : STAT[orderStage(o)];
const anyWaiting = () => S.orders.some(o=>o.waiting);
function staffConfirm(){ if(!anyWaiting()) return false; S.confirmed=true; S.orders.forEach(o=>o.waiting=false); return true; }
function advance(){
  let moved = 0;
  S.orders.filter(o=>!o.waiting).forEach(o=>{
    const min = orderStage(o); if(min>=3) return;
    o.lines.forEach(l=>{ if(l.st===min){ l.st++; moved++; } });
  });
  return moved;
}
function otherPhone(){
  const lines = [{menu:"m9",varian:0,addons:[],note:"",qty:2},{menu:"m6",varian:null,addons:[],note:"",qty:1}];
  return placeOrder("other", lines, "", S.mode==="dulu");
}
function billState(){
  const all = S.orders.flatMap(o=>o.lines), unpaid = S.orders.filter(o=>!o.paid).flatMap(o=>o.lines);
  const a = calc(all), d = calc(unpaid);
  return {all:a, due:d, paid:a.total-d.total, hasUnpaid:unpaid.length>0, pending:S.orders.some(o=>orderStage(o)<3)};
}
function startQris(purpose, amount){ S.qris = {purpose, amount, ends:Date.now()+QRIS_MS, done:false, expired:false}; }
function paySuccess(){
  const q = S.qris; if(!q || q.done) return;
  if(q.purpose==="dulu"){ const o=placeOrder("me", S.cart, S.orderNote, true); S.cart=[]; S.orderNote=""; q.order=o; }
  else { S.orders.forEach(o=>o.paid=true); S.closed=true; }
  q.done = true;
}
function kasirPaid(){ S.orders.forEach(o=>o.paid=true); S.closed=true; }
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.trim());


/* ===================== Komponen tampilan ===================== */
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P = {
  bell:'<path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15L6 16zM10 20a2 2 0 0 0 4 0"/>',
  bag:'<path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 0 1 6 0v2"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  help:'<path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4M12 17h.01"/>',
  search:'<path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/>',
  back:'<path d="M15 5l-7 7 7 7"/>', next:'<path d="M9 5l7 7-7 7"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3zM9 8h6M9 12h6"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>', clock:'<path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2"/>',
  grid:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  utensils:'<path d="M6 3v7a2 2 0 0 0 4 0V3M8 10v11M17 21V3c-2 1.5-3 4-3 7s1 4 3 4"/>',
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;

/* Emoji sebagai "foto" menu + pastel per kategori (desain v3) */
const EMO = {m1:"🍛",m2:"🍗",m3:"🍜",m4:"🍲",m5:"🥗",m6:"🌶️",m7:"🍌",m8:"🍟",m9:"🧋",m10:"☕",m11:"🍊",m12:"💧",m13:"🍧",m14:"🍡"};
const CATV = {utama:{e:"🍛",p:"--c-peach"}, camilan:{e:"🍟",p:"--c-lemon"}, minuman:{e:"🧋",p:"--c-sky"}, penutup:{e:"🍮",p:"--c-lilac"}};
const REASON_E = {"Minta alat makan":"🍴","Minta air":"💧","Lainnya":"✏️"};
const pv = cid => `--p:var(${CATV[cid].p})`;
const emo = m => EMO[m.id] || CATV[m.cat].e;
const th = (m, s="") => `<span class="th ${s}" style="${pv(m.cat)}" aria-hidden="true"><span class="em">${emo(m)}</span></span>`;
const greet = () => { const h=new Date().getHours(); return "Selamat " + (h<11?"pagi":h<15?"siang":h<18?"sore":"malam"); };

const price = m => isPromo(m) ? `<span class="price"><span class="num pr">${rp(basePrice(m))}</span><s class="num">${rp(m.price)}</s></span>` : `<span class="price num">${rp(m.price)}</span>`;
const badges = (m, short) => (m.habis?`<span class="pill danger">Habis</span>`:"") + (isPromo(m)?`<span class="pill promo">${short?"−20%":"Happy Hour −20%"}</span>`:"");
const promoLine = () => S.happy ? `<div class="promo"><span class="e" aria-hidden="true">🧋</span><div class="grow"><b>Happy Hour</b><span class="s">15.00–17.00 · semua minuman</span></div><span class="off">−20%</span></div>` : "";
const inCart = id => S.cart.filter(l=>l.menu===id).reduce((s,l)=>s+l.qty,0);
const who = o => o.by==="me" ? "<b>HP kamu</b>" : "HP lain";
const av = o => `<span class="av ${o.by==="me"?"":"other"}" aria-hidden="true">${o.by==="me"?"📱":"👥"}</span>`;
const qtyOf = o => o.lines.reduce((s,l)=>s+l.qty,0);

/* Pil status: Menunggu = warn, Diterima = aksen, Dimasak = info, Siap/Diantar = ok */
const PILLC = ["acc","info","ok","ok"];
const linePill = s => `<span class="pill ${PILLC[s]}">${s===3?ic("check"):'<span class="d"></span>'}${STAT[s]}</span>`;
const orderPill = o => o.waiting ? `<span class="pill warn"><span class="d"></span>Menunggu konfirmasi</span>` : linePill(orderStage(o));

function callPill(){
  if(!S.call) return "";
  return `<div class="callpill" role="status"><span class="dot pulse"></span><span class="grow">Pelayan dipanggil · ${esc(S.call.reason)} · ${jam(S.call.at)}</span><button class="btn sm" data-act="callCancel">Batalkan</button></div>`;
}
const stepper = (act, q, u="", del=false) => `<span class="stepper">${del&&q===1
  ?`<button class="del" data-act="${act}" data-d="-1" data-u="${u}" aria-label="Hapus">${ic("trash")}</button>`
  :`<button data-act="${act}" data-d="-1" data-u="${u}" aria-label="Kurangi">${ic("minus")}</button>`}<span class="num" aria-live="polite">${q}</span><button data-act="${act}" data-d="1" data-u="${u}" aria-label="Tambah">${ic("plus")}</button></span>`;
function cartBarBtn(act, attrs, label){
  const n = cartCount();
  return `<button class="cartbar" data-act="${act}" ${attrs}><span class="cnt">${ic("bag")}<b>${n}</b></span><span class="t"><b>${label}</b><span>${n} item · Meja ${OUTLET.meja}</span></span><span class="amt num">${rp(calc(S.cart).total)}</span><span class="go">${ic("next")}</span></button>`;
}
const backBtn = (label, act, attrs="") => `<button class="back" data-act="${act}" ${attrs}><span class="ibtn">${ic("back")}</span>${label}</button>`;
const emptyState = (e, pastel, title, sub, btn) => `<div class="empty"><span class="big" style="--p:var(${pastel})" aria-hidden="true">${e}</span><h2>${title}</h2>${sub?`<p class="muted">${sub}</p>`:""}${btn||""}</div>`;

function cfgBody(){
  const m = M(S.cfg.menu), c = S.cfg; let h = "";
  if(m.varian) h += `<fieldset class="grp"><legend><span>${m.varian.name}</span><span class="pill ok">${ic("check")}Wajib · pilih 1</span></legend>
    <div class="opts" role="radiogroup" aria-label="${m.varian.name}">${m.varian.opts.map((o,i)=>`<button class="opt" role="radio" aria-checked="${c.varian===i}" data-act="cfgVar" data-i="${i}"><span class="mark radio"></span><span class="grow">${o.n}</span>${o.p?`<span class="num muted">+${rp(o.p)}</span>`:""}</button>`).join("")}</div></fieldset>`;
  (m.groups||[]).forEach(g=>{
    const n = groupCount(g), rule = g.min>0 ? `Wajib · pilih ${g.min===g.max?g.min:g.min+"–"+g.max}` : `Opsional · maks ${g.max}`;
    const cls = g.min>0 ? (n<g.min?"warn":"ok") : "";
    h += `<fieldset class="grp"><legend><span>${g.name}</span><span class="pill ${cls}">${cls==="ok"?ic("check"):""}${rule}</span></legend><div class="opts">${g.opts.map(o=>{
      const on = c.addons.includes(o.id), dis = !on && g.max>1 && n>=g.max;
      return `<button class="opt" role="checkbox" aria-checked="${on}" ${dis?"disabled":""} data-act="cfgAdd" data-g="${g.id}" data-o="${o.id}"><span class="mark box"></span><span class="grow">${o.n}</span><span class="num muted">${o.p?"+"+rp(o.p):"Gratis"}</span></button>`;
    }).join("")}</div></fieldset>`;
  });
  h += `<label class="grp"><span class="lbl">Catatan untuk dapur <span class="muted" style="font-weight:500">(opsional)</span></span><textarea class="in mt8" id="cfgNote" data-bind="cfgNote" rows="2" maxlength="120" placeholder="Mis. tanpa bawang, saus dipisah">${esc(c.note)}</textarea></label>
    <div class="qtyrow"><span class="lbl">Jumlah</span>${stepper("cfgQty", c.qty)}</div>`;
  return h;
}
function cfgAddBtn(cls="btn primary big block"){
  const short = cfgShort();
  return `<button class="${cls}" data-act="cfgDone" ${short.length?"disabled":""}>${short.length?`Pilih ${short[0].name.toLowerCase()} dulu`:`Tambah ke keranjang · <span class="num">${rp(cfgUnit()*S.cfg.qty)}</span>`}</button>`;
}
function cartLine(l){
  const m=M(l.menu), d=lineDesc(l);
  return `<li class="oline">${th(m,"s44")}<div style="min-width:0"><div class="nm">${m.name}</div>${d?`<div class="sub">${d}</div>`:""}${l.note?`<div class="note">“${esc(l.note)}”</div>`:""}</div><span class="lp num">${rp(lineTotal(l))}</span>
    <div class="ctl"><span class="fine num">${rp(unitPrice(l))} / porsi</span>${stepper("qty", l.qty, l.u, true)}</div></li>`;
}
const orderNoteField = () => `<label class="grp" style="display:block;margin-top:0"><span class="lbl">Catatan untuk pesanan ini <span class="muted" style="font-weight:500">(opsional)</span></span><textarea class="in mt8" id="orderNote" data-bind="orderNote" rows="2" maxlength="140" placeholder="Mis. sajikan minuman duluan">${esc(S.orderNote)}</textarea></label>`;
function totalsHtml(t, label="Total"){
  return `<dl class="totals"><dt>Subtotal</dt><dd class="num">${rp(t.sub)}</dd><dt>Service 5%</dt><dd class="num">${rp(t.svc)}</dd><dt>PBJT 10%</dt><dd class="num">${rp(t.tax)}</dd></dl>
    <div class="grand"><span>${label}</span><b class="num">${rp(t.total)}</b></div>`;
}
function sendNotes(){
  const a = [];
  if(!S.confirmed) a.push(["👀","Pesanan pertama di meja ini dicek staf dulu, lalu masuk dapur."]);
  a.push(S.mode==="dulu" ? ["💳","Outlet ini bayar dulu: bayar lewat QRIS, lalu pesanan langsung dikirim."] : ["🧾","Bayar di akhir: minta tagihan setelah selesai makan."]);
  a.push(["📱","Keranjang ini hanya di HP kamu. Teman semeja bisa pesan dari HP masing-masing."]);
  return `<ul class="notes">${a.map(([e,x])=>`<li><span aria-hidden="true">${e}</span><span>${x}</span></li>`).join("")}</ul>`;
}
const submitLabel = () => S.mode==="dulu" ? `Bayar <span class="num">${rp(calc(S.cart).total)}</span> & kirim` : `Kirim pesanan · <span class="num">${rp(calc(S.cart).total)}</span>`;
function cartPanel(addAct, addAttrs, inlineSubmit){
  const n = cartCount();
  return `<section class="panel mt12"><div class="panel-hd"><div><h1 style="font-size:24px">Pesanan kamu</h1><p class="eyebrow mt4">Meja ${OUTLET.meja} · ${OUTLET.name}</p></div><span class="pill acc lg">${n} item</span></div>
    <ul class="olines mt8">${S.cart.map(cartLine).join("")}</ul>
    <button class="addmore" data-act="${addAct}" ${addAttrs}>${ic("plus")}Tambah menu lain</button>
    <div class="mt20">${orderNoteField()}</div>
    <div class="mt20">${totalsHtml(calc(S.cart))}</div>
    <p class="fine mt8">Harga menu belum termasuk pajak.</p>

function qrSvg(){
  const N=25, cells=[]; let seed=7;
  const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const finder=(x,y)=>{ for(let i=0;i<7;i++)for(let j=0;j<7;j++){ const e=i===0||i===6||j===0||j===6, c=i>=2&&i<=4&&j>=2&&j<=4; if(e||c) cells.push([x+i,y+j]); } };
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  finder(0,0); finder(N-7,0); finder(0,N-7);
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){ if(!inF(x,y) && rnd()>.52) cells.push([x,y]); }
  return `<svg viewBox="0 0 ${N} ${N}" role="img" aria-label="Kode QRIS (contoh)">${cells.map(([x,y])=>`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="currentColor"/>`).join("")}</svg>`;
}
function fmtLeft(ms){ const s=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
const qPct = () => Math.max(0, Math.min(100, (S.qris.ends-Date.now())/QRIS_MS*100));

      <div class="okmark">${ic("check")}</div><h1 id="qt" class="mt24">Pembayaran berhasil</h1><p class="num" style="font-size:30px;font-weight:800;letter-spacing:-.02em">${rp(q.amount)}</p>
      <p class="muted">${o ? (o.waiting?`Pesanan #${o.no} terkirim dan menunggu konfirmasi staf.`:`Pesanan #${o.no} langsung dikirim ke dapur.`) : `Tagihan Meja ${OUTLET.meja} lunas. Terima kasih sudah makan di ${OUTLET.name}.`}</p>
      <div class="mt16" style="width:100%"><button class="btn primary big block" data-act="qrisDone">${o?"Lihat status pesanan":"Selesai"}</button></div></div></div></div>`;

  return `<div class="full" role="dialog" aria-modal="true" aria-labelledby="qt"><div class="full-in">
    <div class="spread"><button class="back" data-act="qrisCancel"><span class="ibtn">${ic("x")}</span>Batal</button><span class="pill acc lg">QRIS dinamis</span></div>
    <div class="qris-amt"><p class="eyebrow">${q.purpose==="dulu"?"Bayar dulu, lalu pesanan dikirim":"Bayar tagihan Meja "+OUTLET.meja}</p><h1 id="qt" class="num">${rp(q.amount)}</h1><p class="fine" style="color:inherit;opacity:.6;margin-top:4px">Total sudah termasuk service dan PBJT</p></div>
    ${q.expired?`<div class="calm" style="min-height:44vh"><span class="em" style="--p:var(--c-lemon)" aria-hidden="true">⌛</span><p class="muted mt16">Kode QRIS kedaluwarsa. Buat kode baru untuk membayar.</p><div><button class="btn primary big" data-act="qrisRenew">Buat kode baru</button></div></div>`
    :`<div class="qrcard"><div class="qh">QRIS<span>${OUTLET.name} · ${OUTLET.area}</span></div><div class="qr">${qrSvg()}</div><p style="font-size:11px;color:#64736d;margin-top:6px">NMID ID1026000000123</p></div>
      <p class="center mt16 muted" style="font-size:14px">Scan atau simpan gambar ini, lalu bayar dengan aplikasi bank atau e-wallet.</p>
      <div class="cd"><span class="dot pulse"></span><span class="grow" style="font-weight:600">Menunggu pembayaran</span><span class="fine">berlaku</span><b class="num" id="qcd">${fmtLeft(left)}</b></div>
      <div class="meter" aria-hidden="true"><div id="qbar" style="width:${qPct()}%"></div></div>
      <div style="margin-top:auto;padding-top:24px"><button class="btn demo block" data-act="qrisPaid">Demo: simulasikan pembayaran berhasil</button></div>`}
  </div></div>`;
}

/* ===================== Render + aksi ===================== */
const VARIANTS = [["A","Daftar bergulir",VariantA],["B","Kartu besar per kategori",VariantB],["C","Tab bawah aplikasi",VariantC]];
let vi = Math.max(0, VARIANTS.findIndex(v=>"#"+v[0]===location.hash));
let demoOpen = false, toTop = false, lastLayer = "";
const $ = id => document.getElementById(id);

function render(){
  const [k, name, fn] = VARIANTS[vi];
  const ae = document.activeElement, fid = ae && ae.id, pos = ae && ae.selectionStart;
  const keep = {}; document.querySelectorAll("[data-keep]").forEach(el=>keep[el.id]=el.scrollLeft);
  const main = S.paused ? pausedView() : S.closed && !S.qris ? closedView() : fn();
  $("app").className = (!S.paused && !(S.closed && !S.qris) && k==="C") ? "c" : "";
  $("app").innerHTML = main;
  const layerKey = S.qris ? "qris" : S.sheet || "";
  $("layer").innerHTML = S.qris ? qrisView() : (S.sheet && !S.paused) ? sheetView() : "";
  $("vlabel").textContent = `${k} · ${name}`;
  $("demo").hidden = !demoOpen; $("demoBtn").setAttribute("aria-expanded", demoOpen);
  if(demoOpen) $("demo").innerHTML = demoView();
  Object.entries(keep).forEach(([id,x])=>{ const el=$(id); if(el) el.scrollLeft=x; });
  if(toTop){ window.scrollTo(0,0); toTop=false; }
  if(fid){ const el=$(fid); if(el && /INPUT|TEXTAREA/.test(el.tagName)){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} } }
  if(layerKey && layerKey!==lastLayer){ const f=document.querySelector("#layer [role=dialog] button:not([disabled])"); f && f.focus({preventScroll:true}); }
  lastLayer = layerKey;
  document.body.style.overflow = layerKey ? "hidden" : "";
}
function go(d){ vi=(vi+d+VARIANTS.length)%VARIANTS.length; history.replaceState(null,"","#"+VARIANTS[vi][0]); if(S.sheet==="cfg") S.sheet=null; S.cfg=null; toTop=true; render(); }
function goTrack(){ S.ui.A.view="orders"; S.ui.B.step="track"; S.ui.C.tab="orders"; toTop=true; }
let toastT;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,3200); }
const cur = () => VARIANTS[vi][0];

const ACT = {
  aView: d=>{ S.ui.A.view=d.v; toTop=true; },
  aCat: d=>{ S.ui.A.cat=d.c; const el=$("sec-"+d.c); if(el) el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); syncATabs(); return false; },
  aOpen: d=>{ if(openCfg(d.id)) S.sheet="cfg"; },
  cfgVar: d=>{ S.cfg.varian=+d.i; },
  cfgAdd: d=>toggleAddon(d.g, d.o),
  cfgQty: d=>{ S.cfg.qty=Math.max(1,S.cfg.qty+(+d.d)); },
  cfgCancel: ()=>{ S.cfg=null; if(cur()==="B") S.ui.B.step="cat"; },
  cfgDone: ()=>{ const m=M(S.cfg.menu), q=S.cfg.qty; if(!addCfgToCart()) return; if(S.sheet==="cfg") S.sheet=null; if(cur()==="B"){ S.ui.B.step="cat"; S.ui.B.cat=m.cat; } toast(`${q}× ${m.name} masuk keranjang`); },
  qty: d=>cartQty(d.u, +d.d),
  submit: ()=>{ const r=submitCart(); if(r&&r.order){ goTrack(); toast(`Pesanan #${r.order.no} terkirim. ${r.order.waiting?"Menunggu konfirmasi staf.":"Langsung ke dapur."}`); } },
  openCall: ()=>{ S.sheet="call"; },
  callReason: d=>{ S.callDraft.reason=d.r; },
  callSend: ()=>{ const d=S.callDraft; if(!d.reason) return; const r=d.reason==="Lainnya"&&d.other.trim()?d.other.trim():d.reason; S.call={reason:r, at:new Date()}; S.callDraft={reason:null,other:""}; if(S.sheet==="call") S.sheet=null; toast("Pelayan dipanggil ke Meja "+OUTLET.meja+"."); },
  callCancel: ()=>{ S.call=null; },
  openBill: ()=>{ S.sheet="bill"; },
  payBill: ()=>{ S.sheet=null; startQris("bill", billState().due.total); },
  kasirBill: ()=>{ S.billRequested=true; S.sheet=null; toast("Tagihan diminta. Pelayan membawa tagihan ke meja."); },
  closeSheet: ()=>{ if(S.sheet==="cfg") S.cfg=null; S.sheet=null; },
  qrisPaid: ()=>paySuccess(),
  qrisCancel: ()=>{ S.qris=null; },
  qrisRenew: ()=>{ S.qris.ends=Date.now()+QRIS_MS; S.qris.expired=false; },
  qrisDone: ()=>{ const o=S.qris.order; S.qris=null; if(o) goTrack(); toTop=true; },
  bCat: d=>{ S.ui.B.cat=d.c; S.ui.B.step="cat"; toTop=true; const c=$("bCar"); if(c) c.scrollLeft=0; },
  bOpen: d=>{ if(openCfg(d.id)){ S.ui.B.step="item"; toTop=true; } },
  bStep: d=>{ S.ui.B.step=d.s; S.cfg=null; toTop=true; },
  cTab: d=>{ S.ui.C.tab=d.t; S.cfg=null; toTop=true; },
  cCat: d=>{ S.ui.C.cat=d.c; S.cfg=null; },
  cToggle: d=>{ if(S.cfg&&S.cfg.menu===d.id) S.cfg=null; else openCfg(d.id); },
  cClear: ()=>{ S.ui.C.q=""; S.ui.C.cat="semua"; },
  whoF: d=>{ S.ui.whoF=d.f; },
  emailSave: ()=>{ if(emailOk(S.email)) S.emailSaved=true; else toast("Format email belum benar, mis. nama@contoh.com"); },
  emailEdit: ()=>{ S.emailSaved=false; },
  dMode: d=>{ S.mode=d.m; toast(d.m==="dulu"?"Mode outlet: bayar dulu.":"Mode outlet: bayar di akhir."); },
  dConfirm: ()=>{ if(staffConfirm()) toast("Staf mengonfirmasi. Pesanan masuk dapur."); },
  dAdvance: ()=>{ if(advance()) toast("Status dapur maju satu langkah."); },
  dOther: ()=>{ const o=otherPhone(); toast(`HP lain menambah Pesanan #${o.no} ke tagihan meja.`); },
  dKasir: ()=>{ kasirPaid(); toTop=true; },
  dPause: ()=>{ S.paused=!S.paused; S.sheet=null; S.cfg=null; },
  dHappy: ()=>{ S.happy=!S.happy; },
  dReset: ()=>{ S=freshState({mode:S.mode}); toTop=true; toast("Sesi meja baru dimulai."); },
};

/* Sinkron chip kategori Variasi A saat menggulir */
function syncATabs(){
  document.querySelectorAll("#aTabs .rchip").forEach(b=>{ const on=b.dataset.c===S.ui.A.cat; b.setAttribute("aria-current", on); if(on){ const p=b.parentElement; const l=b.offsetLeft-16; if(l<p.scrollLeft||l+b.offsetWidth>p.scrollLeft+p.clientWidth) p.scrollTo({left:l}); } });
}
window.addEventListener("scroll", ()=>{
  if(cur()!=="A" || S.ui.A.view!=="menu" || S.paused || S.closed) return;
  const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--top")) || 60;
  let c = CATS[0].id; document.querySelectorAll("[data-sec]").forEach(s=>{ if(s.getBoundingClientRect().top <= top + 130) c = s.dataset.sec; });
  if(window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) c = CATS[CATS.length-1].id;
  if(c!==S.ui.A.cat){ S.ui.A.cat=c; syncATabs(); }
}, {passive:true});

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const r = ACT[el.dataset.act] && ACT[el.dataset.act](el.dataset);
  if(r!==false) render();
});
document.addEventListener("input", e=>{
  const k = e.target.dataset.bind, v = e.target.value; if(!k) return;
  if(k==="cfgNote" && S.cfg) S.cfg.note=v;
  if(k==="orderNote") S.orderNote=v;
  if(k==="email") S.email=v;
  if(k==="callOther") S.callDraft.other=v;
  if(k==="q"){ S.ui.C.q=v; S.cfg=null; render(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    if(demoOpen){ demoOpen=false; render(); $("demoBtn").focus(); return; }
    if(S.qris && !S.qris.done){ S.qris=null; render(); return; }
    if(S.sheet){ ACT.closeSheet(); render(); return; }
  }
  const t = e.target; if(t.closest && t.closest("input,textarea,select,[contenteditable]")) return;
  if(S.sheet || S.qris) return;
  if(e.key==="ArrowLeft") go(-1);
  if(e.key==="ArrowRight") go(1);
});
$("prev").onclick = ()=>go(-1);
$("next").onclick = ()=>go(1);
$("demoBtn").onclick = ()=>{ demoOpen=!demoOpen; render(); };
document.addEventListener("pointerdown", e=>{ if(demoOpen && !e.target.closest("#demo,#demoBtn")){ demoOpen=false; $("demo").hidden=true; $("demoBtn").setAttribute("aria-expanded","false"); } });
setInterval(()=>{
  if(!S.qris || S.qris.done || S.qris.expired) return;
  const left = S.qris.ends - Date.now();
  if(left<=0){ S.qris.expired=true; render(); return; }
  const el=$("qcd"); if(el) el.textContent=fmtLeft(left);
  const bar=$("qbar"); if(bar) bar.style.width=qPct()+"%";
}, 1000);
history.replaceState(null,"","#"+VARIANTS[vi][0]);
render();
</script>
