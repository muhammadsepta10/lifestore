<title>Prototipe Kasir Lifestore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: layar kasir tablet landscape; tiga variasi tata letak di atas satu data dan logika yang sama. Gaya modern minimalis: banyak ruang, garis tipis, satu aksen hijau daun. */
/* Lifestore: token desain bersama (modern, minimalis). Satu aksen hijau daun, netral sedikit kehijauan, garis tipis, tanpa bayangan berat. */
:root{
  --bg:#f7f8f7; --surface:#ffffff; --surface-2:#f0f2f0; --line:#e3e7e3; --line-strong:#cfd6cf;
  --fg:#111814; --muted:#66736b; --faint:#9aa59e;
  --accent:#127a5f; --accent-ink:#ffffff; --accent-soft:#e3f2ec;
  --warn:#b26b00; --warn-soft:#fff3df; --danger:#c2364d; --danger-soft:#fde8ec; --ok:#2e7d4f; --ok-soft:#e5f4ea;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(17,24,20,.04), 0 8px 24px rgba(17,24,20,.06);
  --f-ui:"Geist", "Segoe UI", system-ui, sans-serif;
  --f-num:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c100e; --surface:#141917; --surface-2:#1b211e; --line:#252d29; --line-strong:#334039;
  --fg:#eef2ef; --muted:#9aa79f; --faint:#6b776f;
  --accent:#4cc39d; --accent-ink:#06120d; --accent-soft:#16302a;
  --warn:#f2b250; --warn-soft:#33270f; --danger:#f2879a; --danger-soft:#3a1c23; --ok:#7dd3a0; --ok-soft:#163023;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c100e; --surface:#141917; --surface-2:#1b211e; --line:#252d29; --line-strong:#334039;
  --fg:#eef2ef; --muted:#9aa79f; --faint:#6b776f;
  --accent:#4cc39d; --accent-ink:#06120d; --accent-soft:#16302a;
  --warn:#f2b250; --warn-soft:#33270f; --danger:#f2879a; --danger-soft:#3a1c23; --ok:#7dd3a0; --ok-soft:#163023;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
/* Font: <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap"> */

:root{ --busy:var(--danger); --busy-soft:var(--danger-soft); --bar:var(--fg); --bar-ink:var(--bg); }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;padding-inline:20px;padding-block:16px 100px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid transparent;background:var(--surface-2);border-radius:var(--radius-sm);padding:9px 14px;font-weight:500;transition:background .15s,border-color .15s}
button:hover{background:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--fg))}
button.ghost{background:transparent;color:var(--muted)}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;min-width:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.muted{color:var(--muted)}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.pill.ok::before{background:var(--ok)} .pill.warn::before{background:var(--warn)} .pill.busy::before{background:var(--danger)} .pill.acc::before{background:var(--accent)}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}

.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px;margin-left:10px}

.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line b{font-weight:500}
.line .meta{font-size:12px;color:var(--faint)}
.qty{display:inline-flex;gap:6px;align-items:center}
.qty button{padding:0;width:28px;height:28px;border-radius:50%;line-height:1}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px;padding-top:12px;border-top:1px solid var(--line)}
.totals .grand{font-size:20px;font-weight:600;letter-spacing:-.01em;padding-top:4px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.menu-btn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:84px;padding:14px;background:var(--surface);border:1px solid var(--line)}
.menu-btn:hover{border-color:var(--accent);background:var(--surface)}
.menu-btn b{font-weight:500;line-height:1.3}
.menu-btn.habis{opacity:.4}
.menu-btn.habis b{text-decoration:line-through}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface-2);padding:4px;border-radius:999px;width:fit-content;max-width:100%}
.tabs button{border-radius:999px;padding:6px 14px;background:transparent;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* Variasi A: denah */
.va{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:20px;align-items:start}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.zone-title{grid-column:1/-1;margin-top:8px}
.table{height:104px;border-radius:var(--radius);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:14px;background:var(--surface);border:1px solid var(--line);text-align:left;position:relative}
.table:hover{background:var(--surface);border-color:var(--line-strong)}
.table b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.table::after{content:"";position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.table.Dipesan::after{background:var(--warn)}
.table.Terisi{background:var(--surface-2)}
.table.Terisi::after{background:var(--danger)}
.table.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:0!important}
.legend span:nth-child(1) .sw{background:var(--line-strong)!important}
.legend span:nth-child(2) .sw{background:var(--warn)!important}
.legend span:nth-child(3) .sw{background:var(--danger)!important}

/* Variasi B: tiga kolom */
.vb{display:grid;grid-template-columns:minmax(210px,250px) minmax(0,1fr) minmax(300px,360px);gap:20px;align-items:start}
.bill-list{display:flex;flex-direction:column;gap:4px}
.bill-item{text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 12px;background:transparent}
.bill-item b{font-weight:500}
.bill-item[aria-pressed="true"]{background:var(--accent-soft)}

/* Variasi C: papan kanal */
.vc-head{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.quick{flex:1 1 320px;display:flex;gap:8px}
.quick input{flex:1;font-size:16px;padding:12px 14px;border-radius:999px}
.quick button{border-radius:999px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.card:hover{background:var(--surface);border-color:var(--line-strong)}
.card b{font-weight:500}
.card b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--faint);vertical-align:1px}
.card.k-GoFood b::before{background:#2e9e44}.card.k-GrabFood b::before{background:#14905a}.card.k-ShopeeFood b::before{background:#e2572b}.card.k-Dine-in b::before{background:var(--danger)}.card.k-Takeaway b::before{background:var(--warn)}
.drawer{margin-top:20px}

/* Modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 35%,transparent);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:20px;padding:24px;width:min(520px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.modal h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.paygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.paygrid button{background:var(--surface);border:1px solid var(--line)}
.paygrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:60;max-width:calc(100% - 32px);font-weight:500;box-shadow:var(--shadow)}

/* Bilah pemilih variasi (bagian prototipe, bukan desain) */
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--bar-ink);border-radius:999px;display:flex;align-items:center;gap:2px;padding:4px;box-shadow:var(--shadow);z-index:50;max-width:calc(100% - 32px)}
.switcher button{background:transparent;border:0;color:var(--bar-ink);font-weight:600;padding:6px 12px;border-radius:999px}
.switcher button:hover{background:color-mix(in srgb,var(--bar-ink) 15%,transparent)}
.switcher span{font-weight:500;font-size:13px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:980px){.va,.vb{grid-template-columns:1fr}.board{grid-template-columns:1fr}}
@media (max-width:480px){body{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Palet berwarna terinspirasi aplikasi modern minimalis: Toast POS (oranye hangat), Wise (hijau limau), Stripe (indigo-cyan). "polos" = token asli. */
:root[data-palette="hangat"]{--bg:#fbf7f3;--surface:#ffffff;--surface-2:#f5ede6;--line:#ece1d7;--line-strong:#dccbbd;--fg:#1f1410;--muted:#6f5d52;--faint:#a8968a;--accent:#e5480b;--accent-ink:#ffffff;--accent-soft:#ffe7dc;--accent-2:#ffb020}
:root[data-palette="limau"]{--bg:#f3f6ef;--surface:#ffffff;--surface-2:#e9efe2;--line:#dde6d3;--line-strong:#c4d3b5;--fg:#163300;--muted:#55693f;--faint:#94a684;--accent:#1f4a00;--accent-ink:#c7f59e;--accent-soft:#dcf7c4;--accent-2:#9fe870}
:root[data-palette="indigo"]{--bg:#f6f9fc;--surface:#ffffff;--surface-2:#eef2f8;--line:#e3e8ef;--line-strong:#cfd7e3;--fg:#0a2540;--muted:#425466;--faint:#8898aa;--accent:#635bff;--accent-ink:#ffffff;--accent-soft:#ecebff;--accent-2:#00d4ff}
@media (prefers-color-scheme: dark){
:root[data-palette="hangat"]:not([data-theme="light"]){--bg:#16100c;--surface:#1f1712;--surface-2:#2a1f18;--line:#36291f;--line-strong:#4a382b;--fg:#fbefe7;--muted:#c4ab9b;--faint:#866f61;--accent:#ff7a45;--accent-ink:#1a0a03;--accent-soft:#43200f;--accent-2:#ffc054}
:root[data-palette="limau"]:not([data-theme="light"]){--bg:#0e1a07;--surface:#15240c;--surface-2:#1c2f11;--line:#263d18;--line-strong:#345221;--fg:#ecf7e2;--muted:#a9c194;--faint:#6f8a5d;--accent:#9fe870;--accent-ink:#163300;--accent-soft:#24410f;--accent-2:#9fe870}
:root[data-palette="indigo"]:not([data-theme="light"]){--bg:#0a1628;--surface:#0f1f36;--surface-2:#152844;--line:#1e3352;--line-strong:#2b4467;--fg:#f0f4fa;--muted:#a3b3c7;--faint:#6b7f99;--accent:#8f88ff;--accent-ink:#0a0a2a;--accent-soft:#24245a;--accent-2:#4fe0ff}}
:root[data-palette="hangat"][data-theme="dark"]{--bg:#16100c;--surface:#1f1712;--surface-2:#2a1f18;--line:#36291f;--line-strong:#4a382b;--fg:#fbefe7;--muted:#c4ab9b;--faint:#866f61;--accent:#ff7a45;--accent-ink:#1a0a03;--accent-soft:#43200f;--accent-2:#ffc054}
:root[data-palette="limau"][data-theme="dark"]{--bg:#0e1a07;--surface:#15240c;--surface-2:#1c2f11;--line:#263d18;--line-strong:#345221;--fg:#ecf7e2;--muted:#a9c194;--faint:#6f8a5d;--accent:#9fe870;--accent-ink:#163300;--accent-soft:#24410f;--accent-2:#9fe870}
:root[data-palette="indigo"][data-theme="dark"]{--bg:#0a1628;--surface:#0f1f36;--surface-2:#152844;--line:#1e3352;--line-strong:#2b4467;--fg:#f0f4fa;--muted:#a3b3c7;--faint:#6b7f99;--accent:#8f88ff;--accent-ink:#0a0a2a;--accent-soft:#24245a;--accent-2:#4fe0ff}
/* Sentuhan warna: cahaya lembut di atas halaman, kepala halaman bergradasi, tombol utama bergradasi */
:root:not([data-palette="polos"]) body{background:radial-gradient(900px 360px at 10% -120px,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),radial-gradient(700px 300px at 95% -100px,color-mix(in srgb,var(--accent-2) 16%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
:root:not([data-palette="polos"]) :is(.top,.topbar,.hd){background:linear-gradient(120deg,var(--accent-soft),color-mix(in srgb,var(--accent-2) 20%,var(--surface)));border:0;border-radius:var(--radius);padding:14px 18px}
:root:not([data-palette="polos"]) :is(button.primary,.btn.primary){background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 72%,var(--accent-2)));border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 28%,transparent)}
[hidden]{display:none!important}
.palet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:6px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.palet.atas{bottom:auto;left:auto;right:max(12px,calc(50% - 203px));transform:none;top:calc(var(--top) + 8px)}
.palet button{width:22px;height:22px;min-height:0;min-width:0;padding:0;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);cursor:pointer}
.palet button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
</style>

<div id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<nav class="switcher" aria-label="Pilih variasi prototipe">
  <button id="prev" aria-label="Variasi sebelumnya">‹</button>
  <span id="vlabel"></span>
  <button id="next" aria-label="Variasi berikutnya">›</button>
</nav>

<script>
/* ===== Logika bersama (in-memory, prototipe) ===== */
const rp = n => "Rp" + Math.round(n).toLocaleString("id-ID");
const MENU = [
  {id:"m1",cat:"Makanan",name:"Nasi Goreng Kampung",price:32000,var:["Tidak pedas","Pedas","Extra pedas"],st:"Wajan"},
  {id:"m2",cat:"Makanan",name:"Ayam Bakar Madu",price:42000,st:"Bakar"},
  {id:"m3",cat:"Makanan",name:"Mie Goreng Jawa",price:30000,var:["Tidak pedas","Pedas"],st:"Wajan"},
  {id:"m4",cat:"Makanan",name:"Sop Buntut",price:68000,st:"Kuah"},
  {id:"m5",cat:"Makanan",name:"Gado-gado",price:28000,st:"Dingin",habis:true},
  {id:"m6",cat:"Camilan",name:"Tahu Cabe Garam",price:22000,st:"Wajan"},
  {id:"m7",cat:"Camilan",name:"Pisang Goreng Keju",price:24000,st:"Wajan"},
  {id:"m8",cat:"Camilan",name:"Kentang Goreng",price:20000,st:"Wajan"},
  {id:"m9",cat:"Minuman",name:"Es Teh",price:8000,var:["Manis","Tawar","Less sugar"],st:"Bar"},
  {id:"m10",cat:"Minuman",name:"Es Jeruk",price:14000,st:"Bar"},
  {id:"m11",cat:"Minuman",name:"Kopi Susu Gula Aren",price:22000,var:["Es","Panas"],st:"Bar"},
  {id:"m12",cat:"Minuman",name:"Air Mineral",price:6000,st:"Bar"},
];
const CATS = ["Semua","Makanan","Camilan","Minuman"];
const OJOL = ["GoFood","GrabFood","ShopeeFood"];
const METHODS = ["Tunai","QRIS dinamis","QRIS statis","EDC","Transfer"];
const SERVICE = 0.05, PBJT = 0.10;

let uid = 100;
const S = {
  online:true, queue:0, orderNo:41, notaNo:1203,
  tables:[["A1",2],["A2",4],["A3",4],["A4",2],["A5",6],["A6",4],["B1",8],["B2",4],["B3",2],["B4",2]].map(([id,cap])=>({id,cap,status:"Kosong",bill:null,resv:null})),
  bills:[], done:[],
  shift:{kasir:"Rina",modal:300000,cash:0,nonCash:0,platform:0,cashOut:25000,voids:1,discounts:15000,closed:false,counted:null},
  sel:null, cat:"Semua", q:"", selTable:null,
};
const T = id => S.tables.find(t=>t.id===id);
const B = id => S.bills.find(b=>b.id===id) || S.done.find(b=>b.id===id);
const M = id => MENU.find(m=>m.id===id);

function newBill(kanal, table, extra={}){
  const b = {id:"b"+(++uid), no:++S.orderNo, kanal, table:table||null, items:[], pays:[], name:extra.name||"", kode:extra.kode||"", status:"open", t:new Date()};
  S.bills.push(b);
  if(table){ const t=T(table); t.status="Terisi"; t.bill=b.id; }
  bump(); return b;
}
function addItem(b, m, varian){
  const same = b.items.find(i=>i.menu===m.id && i.varian===(varian||"") && !i.sent);
  if(same) same.qty++; else b.items.push({u:"i"+(++uid), menu:m.id, name:m.name, varian:varian||"", price:m.price, qty:1, sent:false, st:m.st});
  bump();
}
function totals(b){
  const sub = b.items.reduce((s,i)=>s+i.price*i.qty,0);
  const svc = b.kanal==="Dine-in" ? Math.round(sub*SERVICE) : 0;
  const tax = Math.round((sub+svc)*PBJT);
  const total = sub+svc+tax;
  const paid = b.pays.reduce((s,p)=>s+p.amount,0);
  return {sub,svc,tax,total,paid,due:Math.max(0,total-paid)};
}
function bump(){ if(!S.online) S.queue++; }
function sendKitchen(b){
  const fresh = b.items.filter(i=>!i.sent);
  if(!fresh.length){ toast("Tidak ada item baru untuk dikirim."); return; }
  fresh.forEach(i=>i.sent=true);
  const st=[...new Set(fresh.map(i=>i.st))].join(", ");
  bump();
  toast(S.online ? `Terkirim ke dapur (${st}). KDS dan printer dapur menerima.` : `Offline: tiket dicetak di printer dapur (${st}). Masuk antrean Sinkron.`);
}
function closeBill(b){
  b.status="paid"; b.nota = S.online ? "NT-"+(++S.notaNo) : null;
  S.bills = S.bills.filter(x=>x.id!==b.id); S.done.unshift(b);
  if(b.table){ const t=T(b.table); t.status="Kosong"; t.bill=null; }
  if(S.sel===b.id) S.sel=null;
  bump();
}

/* Data awal contoh */
(function seed(){
  const b1=newBill("Dine-in","A2"); addItem(b1,M("m1"),"Pedas"); addItem(b1,M("m9"),"Manis"); addItem(b1,M("m9"),"Manis"); addItem(b1,M("m6")); b1.items.forEach(i=>i.sent=true);
  const b2=newBill("Dine-in","A5"); addItem(b2,M("m4")); addItem(b2,M("m2")); addItem(b2,M("m10")); b2.items.forEach(i=>i.sent=true); addItem(b2,M("m7"));
  const b3=newBill("Takeaway",null,{name:"Pak Budi"}); addItem(b3,M("m3"),"Tidak pedas"); addItem(b3,M("m11"),"Es");

/* ===== Komponen bersama ===== */
function kanalLabel(b){ return b.kanal==="Dine-in" ? "Meja "+b.table : b.kanal==="Takeaway" ? (b.name||"Takeaway") : b.kanal+" · "+b.kode; }
function statusPill(b){
  if(b.status==="pickup") return '<span class="pill ok">Lunas · Siap Diambil</span>';
  const t=totals(b); const unsent=b.items.some(i=>!i.sent);
  if(!b.items.length) return '<span class="pill">Kosong</span>';
  if(unsent) return '<span class="pill warn">Belum dikirim</span>';
  if(t.paid>0) return '<span class="pill acc">Bayar sebagian</span>';
  return '<span class="pill busy">Di dapur</span>';
}
function netPill(){
  return `<button data-act="online" class="${S.online?'':'primary'}" title="Coba mode offline">${S.online?'● Online':'○ Offline'}${S.queue?` · ${S.queue} antre`:''}</button>`;
}
function topbar(extra=""){
  return `<header class="topbar"><div class="brand">Warung Daun<small>Outlet Kemang · Shift ${S.shift.kasir}</small></div>
  <div class="row">${extra}${netPill()}<button data-act="shift">Tutup Shift</button></div></header>`;
}
function menuGrid(){
  const items = MENU.filter(m=>(S.cat==="Semua"||m.cat===S.cat) && (!S.q || m.name.toLowerCase().includes(S.q.toLowerCase())));
  return `<div class="tabs" role="group" aria-label="Kategori">${CATS.map(c=>`<button data-act="cat" data-id="${c}" aria-pressed="${S.cat===c}">${c}</button>`).join("")}</div>
  <div class="menu-grid" style="margin-top:10px">${items.map(m=>`<button class="menu-btn ${m.habis?'habis':''}" data-act="add" data-id="${m.id}"><b>${m.name}</b><span class="num muted">${rp(m.price)}</span>${m.var?'<span class="pill">Varian</span>':''}${m.habis?'<span class="pill busy">Habis</span>':''}</button>`).join("")}</div>`;
}
function billBody(b, compact){
  if(!b) return `<p class="muted">Pilih meja atau tagihan untuk melihat isinya.</p>`;
  const t=totals(b); const ojol=OJOL.includes(b.kanal);
  const lines=b.items.map(i=>`<div class="line"><div><b>${i.name}</b>${i.varian?` <span class="muted">· ${i.varian}</span>`:''}<div class="meta">${i.sent?'Terkirim ke '+i.st:'Belum dikirim'} · ${rp(i.price)}</div></div>
    <div class="qty">${b.status==="open"?`<button data-act="dec" data-u="${i.u}" aria-label="Kurangi">−</button>`:''}<span class="num">${i.qty}</span>${b.status==="open"?`<button data-act="inc" data-u="${i.u}" aria-label="Tambah">+</button>`:''}</div></div>`).join("");
  const pays=b.pays.map(p=>`<span class="muted">Dibayar ${p.m}</span><span class="num">${rp(p.amount)}</span>`).join("");
  return `<div class="spread"><div><div class="label">${b.kanal} · Pesanan #${b.no}</div><div style="font-weight:800;font-size:17px">${kanalLabel(b)}</div></div>${statusPill(b)}</div>
  <div class="lines">${lines||'<p class="muted">Belum ada item. Ketuk menu untuk menambah.</p>'}</div>
  <div class="totals"><span class="muted">Subtotal</span><span class="num">${rp(t.sub)}</span>
  ${t.svc?`<span class="muted">Service 5%</span><span class="num">${rp(t.svc)}</span>`:''}
  <span class="muted">PBJT 10%</span><span class="num">${rp(t.tax)}</span>${pays}
  <span class="grand">${t.paid?'Sisa':'Total'}</span><span class="grand num">${rp(t.paid?t.due:t.total)}</span></div>

    <button data-act="send" ${b.items.some(i=>!i.sent)?'':'disabled'}>Kirim ke dapur</button>

function openModal(html){ document.getElementById("modal").innerHTML=`<div class="scrim" data-scrim><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f=document.querySelector(".modal input,.modal button.primary"); f&&f.focus(); }

function modalVoid(b,i){

function modalSplit(b){
  openModal(`<h2>Pisah tagihan</h2><p class="muted">Centang item yang pindah ke tagihan baru (misal tamu yang bayar sendiri). Pajak dihitung ulang per tagihan.</p>

  <div class="row"><button class="ghost" data-act="close">Batal</button><button class="primary" id="sok">Pindahkan ke tagihan baru</button></div>`);
  document.getElementById("sok").onclick=()=>{ const ids=[...document.querySelectorAll(".modal input:checked")].map(x=>x.value); if(!ids.length||ids.length===b.items.length){ toast("Pilih sebagian item saja."); return; }

}
function modalPay(b){
  const ojol=OJOL.includes(b.kanal);
  let method=ojol?"Piutang Platform":"Tunai"; let amt="";
  const draw=()=>{ const t=totals(b); const cashRound = method==="Tunai" ? Math.round(t.due/100)*100 : t.due;
    const avail = ojol?["Piutang Platform"]:METHODS;
    openModal(`<h2>Bayar ${kanalLabel(b)}</h2>
    <div class="totals"><span class="muted">Total</span><span class="num">${rp(t.total)}</span>${b.pays.map(p=>`<span class="muted">${p.m}</span><span class="num">−${rp(p.amount)}</span>`).join("")}<span class="grand">Sisa</span><span class="grand num">${rp(t.due)}</span></div>
    <div class="paygrid">${avail.map(m=>`<button data-m="${m}" aria-pressed="${m===method}" ${m==="QRIS dinamis"&&!S.online?'disabled title="Butuh internet"':''}>${m}</button>`).join("")}</div>
    ${!S.online&&!ojol?'<p class="muted" style="margin:0">Offline: QRIS dinamis tidak tersedia. Metode lain tetap jalan dan disinkron nanti.</p>':''}
    ${method==="Tunai"?`<label class="stack"><span class="label">Uang diterima</span><input id="pamt" class="num" inputmode="numeric" value="${amt}" placeholder="${cashRound}"></label>
      <div class="row">${[cashRound,50000,100000,200000].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<button data-q="${v}" class="num">${rp(v)}</button>`).join("")}</div>
      ${cashRound!==t.due?`<p class="muted" style="margin:0">Pembulatan Tunai: ${rp(cashRound-t.due)}</p>`:''}`
    : method==="Piutang Platform"?`<p class="muted" style="margin:0">Dicatat sebagai Piutang ${b.kanal}. Komisi Platform diperkirakan saat tutup tagihan, disesuaikan saat dana cair.</p>`
    : `<label class="stack"><span class="label">Nominal ${method}</span><input id="pamt" class="num" inputmode="numeric" value="${amt}" placeholder="${t.due}"></label><p class="muted" style="margin:0">Kosongkan untuk melunasi sisa. Isi sebagian untuk bayar campuran.</p>`}
    <div class="row"><button class="ghost" data-act="close">Batal</button><button class="primary" id="pok" style="flex:1">${method==="QRIS dinamis"?"Tampilkan QR dan tunggu":"Terima pembayaran"}</button></div>`);
    document.querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{ method=el.dataset.m; amt=""; draw(); });
    document.querySelectorAll("[data-q]").forEach(el=>el.onclick=()=>{ amt=el.dataset.q; draw(); });
    document.getElementById("pok").onclick=()=>{
      const t=totals(b); const raw=document.getElementById("pamt"); let v= raw&&raw.value? parseInt(raw.value.replace(/\D/g,""),10) : (method==="Tunai"?cashRound:t.due);
      if(!v||v<=0){ toast("Isi nominal pembayaran."); return; }
      let change=0;
      if(method==="Tunai"){ if(v>=cashRound){ change=v-cashRound; v=t.due; } else if(v>t.due){ v=t.due; } S.shift.cash+=Math.min(v,t.due); }
      else if(method==="Piutang Platform"){ v=t.due; }
      else { v=Math.min(v,t.due); S.shift.nonCash+=v; }
      b.pays.push({m:method,amount:v}); bump();
      if(totals(b).due<=0){
        if(ojol){ b.status="pickup"; if(b.items.some(i=>!i.sent)) sendKitchen(b); closeModal(); toast("Lunas lewat Piutang Platform. Masuk daftar Siap Diambil."); render(); return; }
        closeBill(b); closeModal(); toast(`Lunas.${change?` Kembalian ${rp(change)}.`:''} Struk dicetak${b.nota?' dengan Nomor Nota '+b.nota:' dengan Nomor Pesanan perangkat'}.`); render();
      } else { amt=""; method="Tunai"; draw(); toast(`Diterima ${rp(v)}. Sisa ${rp(totals(b).due)}.`); }
    };
  };
  draw();
}
function modalShift(){
  const sh=S.shift; const expected=sh.modal+sh.cash-sh.cashOut;
  openModal(`<h2>Tutup Shift · ${sh.kasir}</h2>
  <p class="muted" style="margin:0">Hitung Buta: hitung uang di laci dulu. Angka seharusnya baru muncul setelah kamu mengisi.</p>
  <label class="stack"><span class="label">Uang tunai di laci</span><input id="cnt" class="num" inputmode="numeric" placeholder="Contoh: 760000"></label>

  <div class="row"><button class="ghost" data-act="close">Batal</button><button class="primary" id="shok" style="flex:1">Kunci hitungan</button></div>`);
  document.getElementById("shok").onclick=()=>{ const v=parseInt((document.getElementById("cnt").value||"").replace(/\D/g,""),10); if(isNaN(v)){ toast("Isi hasil hitungan dulu."); return; }
    const diff=v-expected; S.bills.length;
    document.getElementById("shres").innerHTML=`<div class="totals">
      <span class="muted">Modal awal</span><span class="num">${rp(sh.modal)}</span>
      <span class="muted">Penjualan tunai</span><span class="num">${rp(sh.cash)}</span>
      <span class="muted">Kas keluar</span><span class="num">−${rp(sh.cashOut)}</span>
      <span>Seharusnya</span><span class="num">${rp(expected)}</span>
      <span>Dihitung</span><span class="num">${rp(v)}</span>
      <span class="grand">Selisih</span><span class="grand num" style="color:${diff===0?'var(--ok)':'var(--busy)'}">${diff>0?'+':''}${rp(diff)}</span>
      <span class="muted">Non-tunai</span><span class="num">${rp(sh.nonCash)}</span>
      <span class="muted">Void / diskon</span><span class="num">${sh.voids} · ${rp(sh.discounts)}</span></div>
      ${S.bills.filter(b=>b.status==="open").length?`<p class="pill warn" style="margin:0">${S.bills.filter(b=>b.status==="open").length} tagihan masih terbuka, akan pindah ke shift berikutnya.</p>`:''}
      <p class="muted" style="margin:0">Laporan Shift dicetak di printer struk dan tersimpan di riwayat.</p>`;
    document.getElementById("cnt").disabled=true; const btn=document.getElementById("shok"); btn.textContent="Selesai"; btn.onclick=closeModal; };
}
let toastT;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,3200); }

/* ===== Pemilih variasi (bagian prototipe) ===== */
const VARIANTS=[["A","Denah meja dulu",VariantA],["B","Tiga kolom POS",VariantB],["C","Papan per kanal",VariantC]];
let vi=Math.max(0,VARIANTS.findIndex(v=>"#"+v[0]===location.hash));
function render(){
  const [k,name,fn]=VARIANTS[vi];
  const focusId=document.activeElement&&document.activeElement.id; const pos=document.activeElement&&document.activeElement.selectionStart;
  document.getElementById("app").innerHTML=fn();
  document.getElementById("vlabel").textContent=`${k} · ${name}`;
  const q=document.getElementById("q"); if(q) q.oninput=e=>{ S.q=e.target.value; render(); };
  const qf=document.getElementById("quick"); if(qf) qf.onsubmit=e=>{ e.preventDefault(); const v=document.getElementById("qc").value.trim().toLowerCase(); const b=B(S.sel);
    if(!b||b.status!=="open"){ toast("Pilih kartu tagihan atau buat pesanan dulu."); return; }
    const m=MENU.find(x=>x.name.toLowerCase().includes(v)); if(!v||!m){ toast("Menu tidak ditemukan."); return; }
    if(m.habis){ toast(m.name+" sedang Habis."); return; }
    if(m.var){ modalVarian(m,b); return; } addItem(b,m); render(); document.getElementById("qc").focus(); };
  if(focusId){ const el=document.getElementById(focusId); if(el&&el.tagName==="INPUT"){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} } }
}
function go(d){ vi=(vi+d+VARIANTS.length)%VARIANTS.length; history.replaceState(null,"","#"+VARIANTS[vi][0]); render(); }
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);
document.addEventListener("keydown",e=>{ const t=e.target; if(t.closest&&t.closest("input,textarea,select,[contenteditable]")) return; if(document.querySelector(".scrim")){ if(e.key==="Escape") closeModal(); return; } if(e.key==="ArrowLeft") go(-1); if(e.key==="ArrowRight") go(1); });
document.addEventListener("click",e=>{
  if(e.target.matches("[data-scrim]")){ closeModal(); return; }
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="newOjol" && el.dataset.p){ modalOjol(el.dataset.p); return; }
  A[act]&&A[act](el.dataset);
});
S.sel=S.bills[0].id; S.selTable="A2";
render();
(function(){/* Pemilih palet warna (prototipe) */
  const P=[["hangat","Oranye hangat (ala Toast POS)","linear-gradient(135deg,#e5480b,#ffb020)"],["limau","Hijau limau (ala Wise)","linear-gradient(135deg,#163300,#9fe870)"],["indigo","Indigo cyan (ala Stripe)","linear-gradient(135deg,#635bff,#00d4ff)"],["polos","Polos (versi sebelumnya)","linear-gradient(135deg,#127a5f,#e3f2ec)"]];
  let cur="hangat";try{const s=localStorage.getItem("lifestore-palet");if(P.some(p=>p[0]===s))cur=s}catch(e){}
  const nav=document.createElement("div");nav.className="palet";nav.setAttribute("role","group");nav.setAttribute("aria-label","Pilih palet warna");
  const set=k=>{cur=k;document.documentElement.dataset.palette=k;try{localStorage.setItem("lifestore-palet",k)}catch(e){}nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.p===k)))};
  P.forEach(([k,t,g])=>{const b=document.createElement("button");b.type="button";b.dataset.p=k;b.title=t;b.setAttribute("aria-label",t);b.style.background=g;b.addEventListener("click",()=>set(k));nav.appendChild(b)});
  if(document.querySelector(".topstrip"))nav.classList.add("atas");document.body.appendChild(nav);set(cur);
})();
