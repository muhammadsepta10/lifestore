<title>Prototipe Kasir Lifestore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Lifestore design system v3: sidebar ikon, kategori pastel, kartu menu ber-emoji, panel pesanan dengan tombol bayar besar. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --surface-2:#f4f7f6; --line:#e6ecea; --line-strong:#d3dcd9;
  --fg:#14201c; --muted:#64736d; --faint:#9aa8a2;
  --accent:#0f9f7f; --accent-ink:#fff; --accent-soft:#dff5ee; --accent-strong:#0b7d64;
  --ink:#14201c;
  --warn:#c27803; --warn-soft:#fff1d6; --danger:#e0445c; --danger-soft:#ffe3e8;
  --ok:#16a34a; --ok-soft:#dcfce7; --info:#2f6fe4; --info-soft:#e0ebff;
  --radius:20px; --radius-md:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,40,32,.04),0 10px 30px rgba(16,40,32,.07);
  --c-peach:#ffd9c2; --c-lemon:#fff0b3; --c-sky:#cfe6ff; --c-lilac:#e6d9ff; --c-mint:#c9f2df; --c-pink:#ffd6e7; --c-sand:#efe4d6; --c-green:#b9edc8;
  --pastel-ink:#14201c;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1211; --surface:#181c1b; --surface-2:#202625; --line:#2a3230; --line-strong:#37413e;
  --fg:#eef3f1; --muted:#9eaca7; --faint:#6b7873;
  --accent:#34d3a6; --accent-ink:#06261d; --accent-soft:#143a30; --accent-strong:#5fe0bb;
  --ink:#eef3f1;
  --warn:#f5b54a; --warn-soft:#3a2c10; --danger:#ff7b8f; --danger-soft:#3d1a21;
  --ok:#4ade80; --ok-soft:#123222; --info:#7fa8ff; --info-soft:#16264a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1211; --surface:#181c1b; --surface-2:#202625; --line:#2a3230; --line-strong:#37413e;
  --fg:#eef3f1; --muted:#9eaca7; --faint:#6b7873;
  --accent:#34d3a6; --accent-ink:#06261d; --accent-soft:#143a30; --accent-strong:#5fe0bb;
  --ink:#eef3f1;
  --warn:#f5b54a; --warn-soft:#3a2c10; --danger:#ff7b8f; --danger-soft:#3d1a21;
  --ok:#4ade80; --ok-soft:#123222; --info:#7fa8ff; --info-soft:#16264a;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark}

/* ---------- Dasar ---------- */
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;padding:16px 16px 104px;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 12px}
.sec-h h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-h small{color:var(--muted);font-size:12px;font-weight:500}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:var(--surface-2);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:left;transition:transform .15s,background-color .15s,box-shadow .15s,color .15s,border-color .15s}
button:hover{background:var(--line)}
button:active:not(:disabled){transform:scale(.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 28%,transparent)}
button.primary:hover{background:var(--accent-strong)}
button.ink{background:var(--ink);color:var(--bg)}
button.ink:hover{background:color-mix(in srgb,var(--ink) 85%,var(--accent))}
button.ghost{background:transparent;color:var(--muted)}
button.ghost:hover{background:var(--surface-2);color:var(--fg)}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
input,select{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid transparent;border-radius:var(--radius-md);padding:12px 14px;min-width:0;min-height:44px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=checkbox]{min-height:0;width:20px;height:20px;accent-color:var(--accent)}

/* Status pill (ref3) */
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);line-height:1.3}
.st.info{background:var(--info-soft);color:var(--info)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.danger{background:var(--danger-soft);color:var(--danger)}
.st.late{background:var(--danger);color:#fff}
.st.acc{background:var(--accent-soft);color:var(--accent-strong)}

/* Segmented control */
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;max-width:100%}
.seg button{flex:1 1 0;min-height:38px;padding:6px 12px;background:transparent;color:var(--muted);font-size:13px;justify-content:center;white-space:nowrap}
.seg button:hover{color:var(--fg);background:transparent}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(16,40,32,.08)}

/* ---------- Sidebar ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:16px;align-items:start}
.shell.rail{grid-template-columns:76px minmax(0,1fr)}
.sb{position:sticky;top:16px;height:calc(100vh - 32px);min-height:520px;display:flex;flex-direction:column;gap:6px;padding:18px 14px}
.sb-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 18px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.sb-i{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap}
.sb-i.on{background:var(--accent-soft);color:var(--accent-strong)}
.sb-i .ct{margin-left:auto;font-size:11px;background:var(--danger);color:#fff;border-radius:999px;padding:1px 7px}
.sb-help{margin-top:auto;background:var(--accent-soft);border-radius:var(--radius-md);padding:14px;display:flex;gap:10px;align-items:center;color:var(--accent-strong);font-size:12px;font-weight:600}
.sb-help b{display:block;color:var(--fg);font-size:13px}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-md);background:var(--surface-2)}
.av{width:38px;height:38px;border-radius:50%;background:var(--c-peach);color:var(--pastel-ink);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.sb-user b{display:block;font-size:13px}
.sb-user small{color:var(--muted);font-size:11px}
.rail .sb{padding:18px 10px;align-items:center}
.rail .sb-brand b,.rail .sb-i span,.rail .sb-i .ct,.rail .sb-help,.rail .sb-user span:not(.av){display:none}
.rail .sb-brand{padding:2px 0 18px}
.rail .sb-i{padding:12px;justify-content:center;position:relative}
.rail .sb-user{margin-top:auto;background:transparent;padding:0}
@media (max-width:1100px){
  .shell{grid-template-columns:76px minmax(0,1fr)}
  .sb{padding:18px 10px;align-items:center}
  .sb-brand b,.sb-i span,.sb-i .ct,.sb-help,.sb-user span:not(.av){display:none}
  .sb-brand{padding:2px 0 18px}
  .sb-i{padding:12px;justify-content:center}
  .sb-user{margin-top:auto;background:transparent;padding:0}
}
@media (max-width:767px){ .shell,.shell.rail{grid-template-columns:minmax(0,1fr)} .sb{display:none} }

/* ---------- Top bar ---------- */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.greet{flex:1 1 220px;min-width:0}
.greet h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.greet p{color:var(--muted);font-size:13px;margin-top:2px}
.search{flex:0 1 320px;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 6px 0 16px;box-shadow:var(--shadow);color:var(--faint);min-width:0}
.search input{flex:1;background:transparent;border:0;box-shadow:none;padding:12px 4px;min-width:0}
.search input:focus{box-shadow:none}
.search:focus-within{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.tact{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vb .top .search{order:3;flex:1 1 260px}
.vb .top .tact{order:4}
.iconbtn{width:44px;height:44px;padding:0;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);position:relative;color:var(--fg)}
.iconbtn:hover{background:var(--surface-2)}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.net{background:var(--surface);box-shadow:var(--shadow);font-size:13px;padding:8px 14px 8px 12px}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.net.off{background:var(--warn-soft);color:var(--warn)}
.net.off i{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 25%,transparent)}
@media (max-width:767px){
  .greet h1{font-size:19px}
  .search{flex:1 1 100%;order:3}
  .tact{flex:1 1 100%;justify-content:flex-start}
  .tact .ink{margin-left:auto}
}

/* ---------- Kategori & menu ---------- */
.ctiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ctile{flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border-radius:16px;min-height:96px;background:var(--tint);color:var(--pastel-ink);position:relative;justify-content:flex-end}
.ctile:hover{background:var(--tint);box-shadow:var(--shadow)}
.ctile .cemo{position:absolute;top:12px;left:14px;font-size:24px;line-height:1}
.ctile b{font-size:15px;font-weight:700}
.ctile small{font-size:12px;opacity:.65;font-weight:500}
.ctile[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.ctile[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;display:grid;place-items:center}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mcard{flex-direction:column;align-items:stretch;gap:4px;padding:10px 10px 12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.mcard:hover{background:var(--surface);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent),var(--shadow)}
.mvis{height:96px;border-radius:14px;background:var(--tint);display:grid;place-items:center;position:relative;margin-bottom:6px;overflow:hidden}
.mvis::before{content:"";position:absolute;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.45)}
.memo{font-size:48px;line-height:1;position:relative;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
.mvis .st{position:absolute;top:8px;left:8px}
.mname{font-weight:600;line-height:1.3;padding:0 4px}
.mvar{font-size:12px;color:var(--muted);font-weight:500;padding:0 4px}
.mfoot{display:flex;align-items:center;justify-content:space-between;padding:4px 0 0 4px}
.mprice{font-weight:700;font-size:15px}
.plus{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px;font-weight:600;line-height:1;flex:none}
.mcard.habis .memo{filter:grayscale(1);opacity:.55}
.mcard.habis .plus{background:var(--line-strong);color:var(--muted)}
.mcard.habis .mname{color:var(--muted)}

/* Chip kategori bulat (ref2) */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chip{flex:none;padding:5px 14px 5px 5px;gap:8px;min-height:44px;background:var(--surface);box-shadow:var(--shadow);font-size:13px}
.chip .ce{width:34px;height:34px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:17px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px 8px 8px;border-radius:16px;background:var(--surface);border-left:4px solid var(--tint);box-shadow:var(--shadow)}
.mrow:hover{background:var(--surface)}
.mrow .thumb{width:48px;height:48px;font-size:26px}
.mrow b{font-weight:600;display:block;line-height:1.25}
.mrow small{color:var(--muted);font-weight:600}
.mrow.habis .thumb{filter:grayscale(1);opacity:.6}
.thumb{width:44px;height:44px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:22px;flex:none}

/* ---------- Kartu tagihan (ref3) ---------- */
.ostrip{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 10px;margin:0 -4px}
.ocard{flex:0 0 218px;flex-direction:column;align-items:stretch;gap:12px;padding:14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.ocard:hover{background:var(--surface)}
.ocard[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.oc-top{display:flex;gap:10px;align-items:center;min-width:0}
.kav{width:38px;height:38px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:18px;flex:none}
.oc-name{min-width:0;display:flex;flex-direction:column}
.oc-name b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-name small{color:var(--muted);font-size:12px;font-weight:500}
.oc-bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oc-amt{font-weight:700}
.addcard{flex:0 0 120px;flex-direction:column;gap:8px;border:2px dashed var(--line-strong);background:transparent;border-radius:18px;color:var(--muted);justify-content:center;align-items:center;text-align:center}
.addcard:hover{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}
.addcard .plus{width:36px;height:36px}

/* ---------- Panel pesanan ---------- */
.order{display:flex;flex-direction:column;gap:14px;padding:20px;position:sticky;top:16px;max-height:calc(100vh - 32px)}
.ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ohead h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
.ohead small{color:var(--muted);font-size:13px;font-weight:500;display:block;margin-top:2px}
.olines{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:60px;flex:1 1 auto;margin:0 -6px;padding:0 6px}
.oline{display:grid;grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"t i p" "t s d";gap:6px 12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.oline:last-child{border-bottom:0}
.oline .thumb{grid-area:t}
.oinfo{grid-area:i;min-width:0}
.oinfo b{font-weight:600;display:block;line-height:1.3}
.oinfo small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
.dot.sent{background:var(--ok)}
.oprice{grid-area:p;font-weight:700;text-align:right}
.ostep{grid-area:s;display:flex;align-items:center;gap:6px}
.ostep button{width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;background:var(--surface-2);font-size:16px;justify-content:center}
.ostep button.inc{background:var(--ink);color:var(--bg)}
.ostep small{white-space:nowrap}
.ostep span{min-width:22px;text-align:center;font-weight:700}
.odel{grid-area:d;justify-self:end;width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;background:transparent;color:var(--faint);justify-content:center}
.odel:hover{background:var(--danger-soft);color:var(--danger)}
.odel .ic{width:17px;height:17px}
.osum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px;padding-top:12px;border-top:1px solid var(--line)}
.osum span:nth-child(odd){color:var(--muted)}
.osum .num{font-weight:600}
.ototal{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ototal span{font-weight:600;color:var(--muted)}
.ototal b{font-size:28px;font-weight:800;letter-spacing:-.02em}
.oact{display:flex;gap:8px}
.oact button{flex:1 1 0;font-size:13px;padding:10px 8px;gap:6px;white-space:nowrap}
.oact .ic{width:17px;height:17px}
.pay{width:100%;min-height:52px;font-size:16px;font-weight:700;justify-content:center}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:28px 12px;color:var(--muted)}
.empty .big{width:76px;height:76px;border-radius:50%;background:var(--tint,var(--surface-2));display:grid;place-items:center;font-size:36px;margin-bottom:4px}
.empty b{color:var(--fg);font-size:15px}
.empty-mini{color:var(--muted);font-size:13px;padding:14px 0;text-align:center}

/* ---------- Variasi A: denah meja ---------- */
.va{display:grid;grid-template-columns:minmax(0,1fr) 372px;grid-template-areas:"top order" "kpi order" "floor order" "menu order";gap:16px;align-items:start}
.va>.top{grid-area:top}.va>.kpis{grid-area:kpi}.va>.floorwrap{grid-area:floor}.va>.order{grid-area:order}.va>.amenu{grid-area:menu}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 12px;align-items:center}
.kpi .ki{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;grid-row:span 2}
.kpi .ki .ic{width:19px;height:19px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font-size:clamp(16px,1.5vw,20px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.kpi small{grid-column:1/-1;font-size:12px;color:var(--ok);font-weight:600;margin-top:4px}
.kpi small.flat{color:var(--muted)}
.floorwrap{display:flex;flex-direction:column;gap:16px;min-width:0}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--tint);border:1px solid color-mix(in srgb,var(--pastel-ink) 12%,transparent)}
.zone{padding:18px}
.zone-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.zone-h .kav{width:34px;height:34px;font-size:16px}
.zone-h b{font-size:15px;font-weight:700}
.zone-h small{margin-left:auto;color:var(--muted);font-weight:600;font-size:12px}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;background:repeating-linear-gradient(0deg,transparent 0 23px,color-mix(in srgb,var(--line) 60%,transparent) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,color-mix(in srgb,var(--line) 60%,transparent) 23px 24px);border-radius:var(--radius-md);padding:12px;background-color:var(--surface-2)}
.tbl{flex-direction:column;gap:6px;padding:12px 8px 10px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);align-items:center;min-height:148px;justify-content:center}
.tbl:hover{background:var(--surface)}
.chairs{display:flex;gap:8px;justify-content:center;height:7px}

const ICONS = {

  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  split:'<path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.17-2.83L3 3"/><path d="m15 9 6-6"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
  wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',

const ic = (n,cls="") => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

let uid = 100;
const S = {
  online:true, queue:0, orderNo:41, notaNo:1203,
  tables:[["A1",2],["A2",4],["A3",4],["A4",2],["A5",6],["A6",4],["B1",8],["B2",4],["B3",2],["B4",2]].map(([id,cap])=>({id,cap,status:"Kosong",bill:null,resv:null})),
  bills:[], done:[],
  shift:{kasir:"Rina",modal:300000,cash:0,nonCash:0,platform:0,cashOut:25000,voids:1,discounts:15000,closed:false,counted:null},
  sel:null, cat:"Semua", q:"", selTable:null,
};
const T = id => S.tables.find(t=>t.id===id);
const B = id => S.bills.find(b=>b.id===id) || S.done.find(b=>b.id===id);
const M = id => MENU.find(m=>m.id===id);

function newBill(kanal, table, extra={}){
  const b = {id:"b"+(++uid), no:++S.orderNo, kanal, table:table||null, items:[], pays:[], name:extra.name||"", kode:extra.kode||"", status:"open", t:new Date()};
  S.bills.push(b);
  if(table){ const t=T(table); t.status="Terisi"; t.bill=b.id; }
  bump(); return b;
}
function addItem(b, m, varian){
  const same = b.items.find(i=>i.menu===m.id && i.varian===(varian||"") && !i.sent);
  if(same) same.qty++; else b.items.push({u:"i"+(++uid), menu:m.id, name:m.name, varian:varian||"", price:m.price, qty:1, sent:false, st:m.st});
  bump();
}
function totals(b){
  const sub = b.items.reduce((s,i)=>s+i.price*i.qty,0);
  const svc = b.kanal==="Dine-in" ? Math.round(sub*SERVICE) : 0;
  const tax = Math.round((sub+svc)*PBJT);
  const total = sub+svc+tax;
  const paid = b.pays.reduce((s,p)=>s+p.amount,0);
  return {sub,svc,tax,total,paid,due:Math.max(0,total-paid)};
}
function bump(){ if(!S.online) S.queue++; }
function sendKitchen(b){
  const fresh = b.items.filter(i=>!i.sent);
  if(!fresh.length){ toast("Tidak ada item baru untuk dikirim."); return; }
  fresh.forEach(i=>i.sent=true);
  const st=[...new Set(fresh.map(i=>i.st))].join(", ");
  bump();
  toast(S.online ? `Terkirim ke dapur (${st}). KDS dan printer dapur menerima.` : `Offline: tiket dicetak di printer dapur (${st}). Masuk antrean Sinkron.`);
}
function closeBill(b){
  b.status="paid"; b.nota = S.online ? "NT-"+(++S.notaNo) : null;
  S.bills = S.bills.filter(x=>x.id!==b.id); S.done.unshift(b);
  if(b.table){ const t=T(b.table); t.status="Kosong"; t.bill=null; }
  if(S.sel===b.id) S.sel=null;
  bump();
}

/* Data awal contoh */

  const b2=newBill("Dine-in","A5"); addItem(b2,M("m4")); addItem(b2,M("m2")); addItem(b2,M("m10")); b2.items.forEach(i=>i.sent=true); addItem(b2,M("m7")); b2.t=ago(22);

/* ===== Komponen bersama ===== */
function kanalLabel(b){ return b.kanal==="Dine-in" ? "Meja "+b.table : b.kanal==="Takeaway" ? (b.name||"Takeaway") : b.kanal+" · "+b.kode; }
function itemCount(b){ return b.items.reduce((s,i)=>s+i.qty,0); }
function ago(b){ const m=Math.floor((Date.now()-b.t)/60000); return m<1?"baru saja":m+" mnt lalu"; }
function statusPill(b){
  if(b.status==="pickup") return '<span class="st ok">Lunas · Siap Diambil</span>';
  const t=totals(b); const unsent=b.items.some(i=>!i.sent);
  if(!b.items.length) return '<span class="st">Kosong</span>';
  if(unsent) return '<span class="st warn">Belum dikirim</span>';
  if(t.paid>0) return '<span class="st acc">Bayar sebagian</span>';
  return '<span class="st info">Di dapur</span>';
}
function billTone(b){ /* warna pastel meja di denah, ikut status tagihan */
  if(!b) return "surface";
  if(!b.items.length) return "mint";
  if(b.items.some(i=>!i.sent)) return "peach";
  if(totals(b).paid>0) return "lilac";
  return "sky";
}
function netPill(){
  return `<button data-act="online" class="net ${S.online?'':'off'}" title="Coba mode offline"><i></i>${S.online?'Online':'Offline'}${S.queue?` · ${S.queue} antre`:''}</button>`;
}
function bellBtn(){
  const n=S.bills.filter(b=>b.status==="pickup").length+S.bills.filter(b=>b.status==="open"&&b.items.some(i=>!i.sent)).length;
  return `<button class="iconbtn" data-act="notif" aria-label="Notifikasi${n?`, ${n} baru`:''}">${ic("bell")}${n?`<span class="badge">${n}</span>`:''}</button>`;
}
function topbar(search=true){

}

/* Bagian panel pesanan: dipakai ulang oleh tiga variasi dengan susunan berbeda */
function billParts(b){
  const t=totals(b); const open=b.status==="open"; const [p]=KANALV[b.kanal];
  const head=`<div class="ohead"><div><h3>${kanalLabel(b)}</h3><small>${KANALV[b.kanal][2]} · Pesanan #${b.no} · ${ago(b)}</small></div>${statusPill(b)}</div>`;
  const lines=b.items.map(i=>{const m=M(i.menu);return `<div class="oline"><span class="thumb" style="${tint(CATV[m.cat][0])}">${m.e}</span>
    <div class="oinfo"><b>${i.name}</b><small>${i.varian?`<span>${i.varian}</span>·`:''}<i class="dot ${i.sent?'sent':''}"></i>${i.sent?'Terkirim ke '+i.st:'Belum dikirim'}</small></div>
    <span class="oprice num">${rp(i.price*i.qty)}</span>
    <div class="ostep">${open?`<button data-act="dec" data-u="${i.u}" aria-label="Kurangi ${i.name}">−</button>`:''}<span class="num">${open?i.qty:i.qty+'×'}</span>${open?`<button class="inc" data-act="inc" data-u="${i.u}" aria-label="Tambah ${i.name}">+</button>`:''}${i.qty>1?`<small class="muted num">× ${rp(i.price)}</small>`:''}</div>
    ${open?`<button class="odel" data-act="del" data-u="${i.u}" aria-label="Hapus ${i.name}" title="${i.sent?'Batalkan (butuh PIN atasan)':'Hapus'}">${ic("trash")}</button>`:''}</div>`;}).join("")
    || `<div class="empty"><span class="big" style="${tint(p)}">${KANALV[b.kanal][1]}</span><b>Belum ada item</b><span>Ketuk menu untuk menambah.</span></div>`;
  const pays=b.pays.map(x=>`<span>Dibayar ${x.m}</span><span class="num">−${rp(x.amount)}</span>`).join("");
  const sum=`<div class="osum"><span>Subtotal</span><span class="num">${rp(t.sub)}</span>
    ${t.svc?`<span>Service 5%</span><span class="num">${rp(t.svc)}</span>`:''}
    <span>PBJT 10%</span><span class="num">${rp(t.tax)}</span>${pays}</div>
    <div class="ototal"><span>${t.paid?'Sisa':'Total'}</span><b class="num">${rp(t.paid?t.due:t.total)}</b></div>`;
  const actions= open ? `<div class="oact"><button data-act="send" ${b.items.some(i=>!i.sent)?'':'disabled'}>${ic("send")}Kirim ke dapur</button><button data-act="split" ${b.items.length>1?'':'disabled'}>${ic("split")}Pisah tagihan</button></div>
    <button class="primary pay" data-act="pay" ${t.total?'':'disabled'}>Bayar ${rp(t.due)}</button>`
    : b.status==="pickup" ? `<button class="primary pay" data-act="pickup" data-id="${b.id}">🛵 Sudah diambil driver</button>` : '';
  return {head,lines,sum,actions};
}
function orderPanel(b, emptyHtml){

}

/* ===== Modal ===== */
function openModal(html){ document.getElementById("modal").innerHTML=`<div class="scrim" data-scrim><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f=document.querySelector(".modal input:not([type=checkbox]),.modal button.primary"); f&&f.focus(); }
function closeModal(){ document.getElementById("modal").innerHTML=""; }
function modalVarian(m,b){
  openModal(`<div class="mh"><span class="thumb" style="${tint(CATV[m.cat][0])}">${m.e}</span><div><h2>${m.name}</h2><p class="muted">Pilih varian untuk ${kanalLabel(b)}.</p></div></div><div class="paygrid">${m.var.map(v=>`<button data-act="addVar" data-id="${m.id}" data-v="${v}">${v}</button>`).join("")}</div><button class="ghost" data-act="close">Batal</button>`);
}
function modalVoid(b,i){
  const m=M(i.menu);
  openModal(`<div class="mh"><span class="thumb" style="--tint:var(--danger-soft)">${m.e}</span><h2>Batalkan ${i.name}?</h2></div><p>Item ini sudah dikirim ke dapur. Pembatalan butuh <b>Persetujuan Atasan</b> dan dicatat sebagai Waste di Log Audit.</p>
  <label class="stack"><span class="label">Alasan</span><select id="vreason"><option>Salah input</option><option>Tamu batal</option><option>Lama tidak keluar</option></select></label>
  <label class="stack"><span class="label">PIN atasan</span><input id="vpin" inputmode="numeric" maxlength="6" placeholder="Contoh: 1234"></label>
  <div class="row"><button class="ghost" data-act="close">Kembali</button><button class="primary" id="vok">Batalkan item</button></div>`);
  document.getElementById("vok").onclick=()=>{ if(document.getElementById("vpin").value.length<4){ toast("Masukkan PIN atasan (contoh: 1234)."); return; } i.qty--; if(i.qty<=0) b.items=b.items.filter(x=>x!==i); S.shift.voids++; bump(); closeModal(); toast("Item dibatalkan, tercatat sebagai Waste."); render(); };
}
function modalTables(){
  const free=S.tables.filter(t=>t.status!=="Terisi");
  openModal(`<h2>Pilih meja</h2><p class="muted">Meja kosong dan yang sudah dipesan.</p><div class="paygrid">${free.map(t=>`<button data-tb="${t.id}"><span class="pe">${t.status==="Dipesan"?"📅":"🪑"}</span><span><b>${t.id}</b> · ${t.cap} kursi${t.status==="Dipesan"?' (dipesan)':''}</span></button>`).join("")}</div><button class="ghost" data-act="close">Batal</button>`);
  document.querySelectorAll("[data-tb]").forEach(el=>el.onclick=()=>{ const t=T(el.dataset.tb); t.resv=null; closeModal(); A.openTable({id:t.id}); });
}
function modalOjol(pre){
  let plat=pre||"GoFood";
  const draw=()=>openModal(`<div class="mh"><span class="thumb" style="${tint(KANALV[plat][0])}">🛵</span><div><h2>Pesanan ojol</h2><p class="muted">Salin dari tablet ${plat}. Tagihan langsung lunas lewat Piutang Platform.</p></div></div>
  <div class="seg">${OJOL.map(o=>`<button data-pl="${o}" aria-pressed="${o===plat}">${o}</button>`).join("")}</div>
  <label class="stack"><span class="label">Kode Pesanan Platform</span><input id="okode" placeholder="Contoh: F-48219" autocomplete="off"></label>
  <label class="stack"><span class="label">Nama pemesan (opsional)</span><input id="oname" placeholder="Nama di aplikasi"></label>
  <div class="row"><button class="ghost" data-act="close">Batal</button><button class="primary" id="ook">Buat pesanan, lalu pilih menu</button></div>`);
  draw();
  const wire=()=>{ document.querySelectorAll("[data-pl]").forEach(el=>el.onclick=()=>{ plat=el.dataset.pl; draw(); wire(); });
    document.getElementById("ook").onclick=()=>{ const k=document.getElementById("okode").value.trim(); if(!k){ toast("Kode Pesanan Platform wajib diisi."); return; }
      const b=newBill(plat,null,{kode:k,name:document.getElementById("oname").value}); b.isOjol=true; S.sel=b.id; closeModal(); toast("Pilih menu, lalu tekan Bayar untuk mencatat Piutang Platform."); render(); }; };
  wire();
}
function modalSplit(b){
  openModal(`<h2>Pisah tagihan</h2><p class="muted">Centang item yang pindah ke tagihan baru (misal tamu yang bayar sendiri). Pajak dihitung ulang per tagihan.</p>
  <div class="stack" style="gap:8px">${b.items.map(i=>`<label class="chk"><input type="checkbox" value="${i.u}"><span class="thumb" style="width:36px;height:36px;font-size:18px;${tint(CATV[M(i.menu).cat][0])}">${M(i.menu).e}</span><span>${i.qty}× ${i.name}${i.varian?' · '+i.varian:''}</span><span class="num muted" style="margin-left:auto">${rp(i.price*i.qty)}</span></label>`).join("")}</div>
  <div class="row"><button class="ghost" data-act="close">Batal</button><button class="primary" id="sok">Pindahkan ke tagihan baru</button></div>`);
  document.getElementById("sok").onclick=()=>{ const ids=[...document.querySelectorAll(".modal input:checked")].map(x=>x.value); if(!ids.length||ids.length===b.items.length){ toast("Pilih sebagian item saja."); return; }
    const nb={id:"b"+(++uid),no:++S.orderNo,kanal:b.kanal,table:b.table,items:b.items.filter(i=>ids.includes(i.u)),pays:[],name:(b.name||"")+" (pisah)",kode:b.kode,status:"open",t:new Date()};
    b.items=b.items.filter(i=>!ids.includes(i.u)); S.bills.push(nb); S.sel=nb.id; bump(); closeModal(); toast("Tagihan dipisah. Yang baru sedang dibuka."); render(); };
}
function modalPay(b){
  const ojol=OJOL.includes(b.kanal);
  let method=ojol?"Piutang Platform":"Tunai"; let amt="";
  const draw=()=>{ const t=totals(b); const cashRound = method==="Tunai" ? Math.round(t.due/100)*100 : t.due;
    const avail = ojol?["Piutang Platform"]:METHODS;
    openModal(`<h2>Bayar ${kanalLabel(b)}</h2>
    <div class="totals"><span class="muted">Total</span><span class="num">${rp(t.total)}</span>${b.pays.map(p=>`<span class="muted">${p.m}</span><span class="num">−${rp(p.amount)}</span>`).join("")}<span class="grand">Sisa</span><span class="grand num">${rp(t.due)}</span></div>
    <div class="paygrid">${avail.map(m=>`<button data-m="${m}" aria-pressed="${m===method}" ${m==="QRIS dinamis"&&!S.online?'disabled title="Butuh internet"':''}><span class="pe" aria-hidden="true">${PAYE[m]}</span>${m}</button>`).join("")}</div>
    ${!S.online&&!ojol?'<p class="note warnbox">Offline: QRIS dinamis tidak tersedia. Metode lain tetap jalan dan disinkron nanti.</p>':''}
    ${method==="Tunai"?`<label class="stack"><span class="label">Uang diterima</span><input id="pamt" class="num" inputmode="numeric" value="${amt}" placeholder="${cashRound}"></label>
      <div class="row quickamt">${[cashRound,50000,100000,200000].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<button data-q="${v}" class="num">${rp(v)}</button>`).join("")}</div>
      ${cashRound!==t.due?`<p class="note">Pembulatan Tunai: ${rp(cashRound-t.due)}</p>`:''}`
    : method==="Piutang Platform"?`<p class="note">Dicatat sebagai Piutang ${b.kanal}. Komisi Platform diperkirakan saat tutup tagihan, disesuaikan saat dana cair.</p>`
    : `<label class="stack"><span class="label">Nominal ${method}</span><input id="pamt" class="num" inputmode="numeric" value="${amt}" placeholder="${t.due}"></label><p class="note">Kosongkan untuk melunasi sisa. Isi sebagian untuk bayar campuran.</p>`}
    <div class="row"><button class="ghost" data-act="close">Batal</button><button class="primary" id="pok" style="flex:1;min-height:52px">${method==="QRIS dinamis"?"Tampilkan QR dan tunggu":"Terima pembayaran"}</button></div>`);
    document.querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{ method=el.dataset.m; amt=""; draw(); });
    document.querySelectorAll("[data-q]").forEach(el=>el.onclick=()=>{ amt=el.dataset.q; draw(); });
    document.getElementById("pok").onclick=()=>{
      const t=totals(b); const raw=document.getElementById("pamt"); let v= raw&&raw.value? parseInt(raw.value.replace(/\D/g,""),10) : (method==="Tunai"?cashRound:t.due);
      if(!v||v<=0){ toast("Isi nominal pembayaran."); return; }
      let change=0;
      if(method==="Tunai"){ if(v>=cashRound){ change=v-cashRound; v=t.due; } else if(v>t.due){ v=t.due; } S.shift.cash+=Math.min(v,t.due); }
      else if(method==="Piutang Platform"){ v=t.due; }
      else { v=Math.min(v,t.due); S.shift.nonCash+=v; }
      b.pays.push({m:method,amount:v}); bump();
      if(totals(b).due<=0){
        if(ojol){ b.status="pickup"; if(b.items.some(i=>!i.sent)) sendKitchen(b); closeModal(); toast("Lunas lewat Piutang Platform. Masuk daftar Siap Diambil."); render(); return; }
        closeBill(b); closeModal(); toast(`Lunas.${change?` Kembalian ${rp(change)}.`:''} Struk dicetak${b.nota?' dengan Nomor Nota '+b.nota:' dengan Nomor Pesanan perangkat'}.`); render();
      } else { amt=""; method="Tunai"; draw(); toast(`Diterima ${rp(v)}. Sisa ${rp(totals(b).due)}.`); }
    };
  };
  draw();
}
function modalShift(){
  const sh=S.shift; const expected=sh.modal+sh.cash-sh.cashOut;
  openModal(`<div class="mh"><span class="thumb" style="${tint('sand')}">🔒</span><div><h2>Tutup Shift · ${sh.kasir}</h2><p class="muted">Hitung Buta: hitung uang di laci dulu. Angka seharusnya baru muncul setelah kamu mengisi.</p></div></div>
  <label class="stack"><span class="label">Uang tunai di laci</span><input id="cnt" class="num" inputmode="numeric" placeholder="Contoh: 760000"></label>
  <div id="shres" class="stack"></div>
  <div class="row"><button class="ghost" data-act="close">Batal</button><button class="primary" id="shok" style="flex:1">Kunci hitungan</button></div>`);
  document.getElementById("shok").onclick=()=>{ const v=parseInt((document.getElementById("cnt").value||"").replace(/\D/g,""),10); if(isNaN(v)){ toast("Isi hasil hitungan dulu."); return; }
    const diff=v-expected;
    const openN=S.bills.filter(b=>b.status==="open").length;
    document.getElementById("shres").innerHTML=`<div class="totals">
      <span class="muted">Modal awal</span><span class="num">${rp(sh.modal)}</span>
      <span class="muted">Penjualan tunai</span><span class="num">${rp(sh.cash)}</span>
      <span class="muted">Kas keluar</span><span class="num">−${rp(sh.cashOut)}</span>
      <span>Seharusnya</span><span class="num">${rp(expected)}</span>
      <span>Dihitung</span><span class="num">${rp(v)}</span>
      <span class="grand">Selisih</span><span class="grand num" style="color:${diff===0?'var(--ok)':'var(--danger)'}">${diff>0?'+':''}${rp(diff)}</span>
      <span class="muted">Non-tunai</span><span class="num">${rp(sh.nonCash)}</span>
      <span class="muted">Void / diskon</span><span class="num">${sh.voids} · ${rp(sh.discounts)}</span></div>
      ${openN?`<p class="note warnbox">${openN} tagihan masih terbuka, akan pindah ke shift berikutnya.</p>`:''}
      <p class="note">Laporan Shift dicetak di printer struk dan tersimpan di riwayat.</p>`;
    document.getElementById("cnt").disabled=true; const btn=document.getElementById("shok"); btn.textContent="Selesai"; btn.onclick=closeModal; };
}
let toastT;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,3200); }

/* ===== Pemilih variasi (bagian prototipe) ===== */
const VARIANTS=[["A","Denah meja dulu",VariantA],["B","Tiga kolom POS",VariantB],["C","Papan per kanal",VariantC]];
let vi=Math.max(0,VARIANTS.findIndex(v=>"#"+v[0]===location.hash));
function render(){
  const [k,name,fn]=VARIANTS[vi];
  const focusId=document.activeElement&&document.activeElement.id; const pos=document.activeElement&&document.activeElement.selectionStart;
  document.getElementById("app").innerHTML=fn();
  document.getElementById("vlabel").textContent=`${k} · ${name}`;
  const q=document.getElementById("q"); if(q) q.oninput=e=>{ S.q=e.target.value; render(); };
  const qf=document.getElementById("quick"); if(qf) qf.onsubmit=e=>{ e.preventDefault(); const v=document.getElementById("qc").value.trim().toLowerCase(); const b=B(S.sel);
    if(!b||b.status!=="open"){ toast("Pilih kartu tagihan atau buat pesanan dulu."); return; }
    const m=MENU.find(x=>x.name.toLowerCase().includes(v)); if(!v||!m){ toast("Menu tidak ditemukan."); return; }
    if(m.habis){ toast(m.name+" sedang Habis."); return; }
    if(m.var){ modalVarian(m,b); return; } addItem(b,m); render(); document.getElementById("qc").focus(); };
  if(focusId){ const el=document.getElementById(focusId); if(el&&el.tagName==="INPUT"){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} } }
}
function go(d){ vi=(vi+d+VARIANTS.length)%VARIANTS.length; history.replaceState(null,"","#"+VARIANTS[vi][0]); render(); }
document.getElementById("prev").onclick=()=>go(-1);
document.getElementById("next").onclick=()=>go(1);
document.addEventListener("keydown",e=>{ const t=e.target; if(t.closest&&t.closest("input,textarea,select,[contenteditable]")) return; if(document.querySelector(".scrim")){ if(e.key==="Escape") closeModal(); return; } if(e.key==="ArrowLeft") go(-1); if(e.key==="ArrowRight") go(1); });
document.addEventListener("click",e=>{
  if(e.target.matches("[data-scrim]")){ closeModal(); return; }
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act;
  if(act==="newOjol" && el.dataset.p){ modalOjol(el.dataset.p); return; }
  A[act]&&A[act](el.dataset);
});
S.sel=S.bills[0].id; S.selTable="A2";
render();
</script>
