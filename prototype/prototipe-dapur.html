<title>Prototipe Dapur Lifestore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Lifestore design system v3: kanvas hijau mint lembut, kartu putih membulat, pastel per kategori/stasiun, pil status berwarna. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --surface-2:#f4f7f6; --line:#e6ecea; --line-strong:#d3dcd9;
  --fg:#14201c; --muted:#64736d; --faint:#9aa8a2;
  --accent:#0f9f7f; --accent-ink:#fff; --accent-soft:#dff5ee; --accent-strong:#0b7d64;
  --ink:#14201c; --ink-fg:#ffffff;
  --warn:#c27803; --warn-soft:#fff1d6; --danger:#e0445c; --danger-soft:#ffe3e8;
  --ok:#16a34a; --ok-soft:#dcfce7; --info:#2f6fe4; --info-soft:#e0ebff;
  --radius:20px; --radius-md:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(16,40,32,.04),0 10px 30px rgba(16,40,32,.07);
  --shadow-sm:0 1px 2px rgba(16,40,32,.05),0 4px 12px rgba(16,40,32,.05);
  --c-peach:#ffd9c2; --c-lemon:#fff0b3; --c-sky:#cfe6ff; --c-lilac:#e6d9ff; --c-mint:#c9f2df; --c-pink:#ffd6e7; --c-sand:#efe4d6; --c-green:#c4eecb;
  --on-pastel:#14201c;
  --late:#e0445c; /* pita terlambat: merah pekat yang sama di kedua tema, teks putih */
  --f-ui:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1211; --surface:#181c1b; --surface-2:#202625; --line:#2a3230; --line-strong:#37413e;
  --fg:#eef3f1; --muted:#9eaca7; --faint:#6b7873;
  --accent:#34d3a6; --accent-ink:#06261d; --accent-soft:#143a30; --accent-strong:#5fe0bb;
  --ink:#eef3f1; --ink-fg:#0f1211;
  --warn:#f5b54a; --warn-soft:#3a2c10; --danger:#ff7b8f; --danger-soft:#3d1a21;
  --ok:#4ade80; --ok-soft:#123222; --info:#7fa8ff; --info-soft:#16264a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1211; --surface:#181c1b; --surface-2:#202625; --line:#2a3230; --line-strong:#37413e;
  --fg:#eef3f1; --muted:#9eaca7; --faint:#6b7873;
  --accent:#34d3a6; --accent-ink:#06261d; --accent-soft:#143a30; --accent-strong:#5fe0bb;
  --ink:#eef3f1; --ink-fg:#0f1211;
  --warn:#f5b54a; --warn-soft:#3a2c10; --danger:#ff7b8f; --danger-soft:#3d1a21;
  --ok:#4ade80; --ok-soft:#123222; --info:#7fa8ff; --info-soft:#16264a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);
  color-scheme:dark}

/* ===== Dasar ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 420px at 0% -160px,color-mix(in srgb,var(--accent) 12%,transparent),transparent 70%),var(--bg);background-color:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.4;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:var(--surface-2);border-radius:999px;padding:10px 18px;min-height:44px;font-weight:600;transition:transform .15s,background-color .15s,box-shadow .15s,filter .15s}
button:hover:not(:disabled){filter:brightness(.97)}
button:active:not(:disabled){transform:scale(.98)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 30%,transparent)}
button.primary:hover:not(:disabled){filter:brightness(1.06)}
button.ink{background:var(--ink);color:var(--ink-fg)}
button.quiet{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.empty{color:var(--faint);padding:28px 8px;text-align:center;font-weight:500}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Pil status (ref3) */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;line-height:1.2}
.pill.antre{background:var(--info-soft);color:var(--info)}
.pill.dimasak{background:var(--warn-soft);color:var(--warn)}
.pill.siap{background:var(--ok-soft);color:var(--ok)}
.pill.late{background:var(--late);color:#fff}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.alergi{background:var(--late);color:#fff}
.pill.batal{background:var(--danger-soft);color:var(--danger);text-decoration:line-through}
.pill.recall{background:var(--c-lilac);color:var(--on-pastel)}
.pill.ghost{background:var(--surface-2);color:var(--muted)}

/* Lencana kanal */
.ch{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:5px 12px 5px 8px;border-radius:999px;color:var(--on-pastel);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ch.dine{background:var(--c-lilac)} .ch.take{background:var(--c-lemon)}
.ch.gofood{background:var(--c-mint)} .ch.grabfood{background:var(--c-green)} .ch.shopeefood{background:var(--c-peach)}
.kode{font-size:14px;font-weight:600;color:var(--muted)}

/* Pastel per stasiun */
.p-sand{--p:var(--c-sand)} .p-pink{--p:var(--c-pink)} .p-mint{--p:var(--c-mint)} .p-sky{--p:var(--c-sky)} .p-lilac{--p:var(--c-lilac)} .p-lemon{--p:var(--c-lemon)} .p-peach{--p:var(--c-peach)}

/* ===== Kerangka: rel ikon + isi ===== */
.shell{display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;padding:16px 16px calc(104px + env(safe-area-inset-bottom,0px))}
.rail{position:sticky;top:16px;height:calc(100vh - 32px);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 0}
.logo{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:20px;margin-bottom:14px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.rail .nav{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:var(--muted)}
.rail .nav.on{background:var(--accent-soft);color:var(--accent-strong)}
.rail .nav svg.i{width:22px;height:22px}
.rail .sp{flex:1}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--c-peach);color:var(--on-pastel);display:grid;place-items:center;font-weight:800;font-size:15px}
#app{min-width:0}

/* Bilah atas */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.hello h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hello p{margin:2px 0 0;color:var(--muted);font-size:14px;font-weight:500}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clock{font-size:30px;font-weight:800;letter-spacing:-.02em;background:var(--surface);border-radius:999px;padding:6px 20px;box-shadow:var(--shadow-sm);line-height:1.2}
.net{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:700;font-size:14px}
.net.off{background:var(--late);color:#fff}
.net i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 25%,transparent)}
.recallbtn{background:var(--surface);box-shadow:var(--shadow-sm);display:inline-flex;gap:8px;align-items:center;position:relative;padding-right:14px}
.badge{min-width:24px;height:24px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}

/* KPI (ref1) */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:grid;grid-template-columns:44px 1fr;gap:2px 14px;align-items:center;min-width:0}
.kpi .ico{grid-row:1/3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.kpi .k{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.kpi .v small{font-size:16px;font-weight:700;color:var(--muted);margin-left:2px}
.kpi .d{grid-column:1/3;font-size:13px;font-weight:600;margin-top:8px}
.kpi .d.ok{color:var(--ok)} .kpi .d.bad{color:var(--danger)} .kpi .d.warn{color:var(--warn)} .kpi .d.mut{color:var(--muted)}
.ico.acc{background:var(--accent-soft);color:var(--accent-strong)}
.ico.dan{background:var(--danger-soft);color:var(--danger)}
.ico.wrn{background:var(--warn-soft);color:var(--warn)}
.ico.inf{background:var(--info-soft);color:var(--info)}
.kpi.alarm{background:var(--late);color:#fff}
.kpi.alarm .k,.kpi.alarm .d{color:#fff}
.kpi.alarm .ico{background:rgba(255,255,255,.22);color:#fff}

/* Petak stasiun + demo */
.stations{display:flex;gap:10px;overflow-x:auto;padding:4px;margin:-4px -4px 14px;scrollbar-width:none;min-width:0}
.subbar{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.subbar h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.stations::-webkit-scrollbar{display:none}
.tile{flex:1 0 132px;background:var(--p);color:var(--on-pastel);border-radius:16px;padding:12px 16px 12px 12px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;text-align:left;min-height:64px;box-shadow:inset 0 0 0 2px transparent}
.tile .e{grid-row:1/3;font-size:26px;line-height:1;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.55);display:grid;place-items:center}
.tile b{font-size:16px;font-weight:800}
.tile small{font-size:13px;font-weight:600;opacity:.7}
.tile[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--on-pastel),0 6px 16px rgba(16,40,32,.12)}
.tile.all{--p:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.tile.all .e{background:var(--accent-soft)}
.tile.all[aria-pressed="true"]{--p:var(--ink);color:var(--ink-fg);box-shadow:0 6px 16px rgba(16,40,32,.16)}
.tile.all[aria-pressed="true"] .e{background:color-mix(in srgb,var(--ink-fg) 18%,transparent)}
.demo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border:1.5px dashed var(--line-strong);border-radius:20px;padding:6px 6px 6px 14px;}
.demo .label{font-size:11px;margin-right:2px}
.demo button{min-height:40px;padding:6px 14px;font-size:13px;background:var(--surface);box-shadow:var(--shadow-sm)}

/* Banner offline */
.offline{display:flex;gap:16px;align-items:center;background:var(--danger-soft);color:var(--fg);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;box-shadow:inset 0 0 0 2px var(--danger)}
.offline .ico{width:44px;height:44px;border-radius:50%;background:var(--late);color:#fff;display:grid;place-items:center;flex:none}
.offline b{color:var(--danger);display:block;font-size:17px}
.is-offline main{opacity:.55;filter:saturate(.6)}

/* ===== Baris item (tiket) ===== */
.item{display:grid;grid-template-columns:48px minmax(0,1fr) 34px;gap:2px 12px;align-items:center;width:100%;text-align:left;border-radius:var(--radius-md);background:transparent;padding:8px;min-height:64px;font-weight:400}
.item+.item{margin-top:2px}
.item:hover:not(:disabled){background:var(--surface-2);filter:none}
.thumb{grid-row:1/3;width:48px;height:48px;border-radius:14px;background:var(--p);display:grid;place-items:center;font-size:26px;line-height:1;align-self:start}
.item .nm{font-size:19px;font-weight:700;line-height:1.25;letter-spacing:-.01em;min-width:0}
.item .nm .q{font-weight:800;font-size:22px;margin-right:6px;color:var(--accent-strong)}
.item .st{font-size:13px;color:var(--muted);font-weight:600;grid-column:2}
.item .mark{grid-column:3;grid-row:1/3}
.item .sub{grid-column:2/4;font-size:15px;color:var(--muted);font-weight:500}
.item .note,.agg .note{grid-column:1/4;font-size:15px;font-weight:600;color:var(--on-pastel);background:var(--c-lemon);border-radius:10px;padding:6px 12px;margin-top:6px}
.item .alg,.agg .alg{grid-column:1/4;margin-top:6px;background:var(--late);border-radius:12px;padding:10px 14px;color:#fff;font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:8px;align-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--late) 30%,transparent)}
.mark{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 2.5px var(--line-strong);display:grid;place-items:center;font-size:15px;font-weight:800;color:#fff}
.mark.dimasak{background:var(--warn-soft);box-shadow:inset 0 0 0 2.5px var(--warn)}
.mark.dimasak::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--warn)}
.mark.siap{background:var(--ok);box-shadow:none}
.mark.siap svg.i{width:18px;height:18px;stroke-width:3}
.item.siap .nm{color:var(--muted)}
.item.siap .thumb{opacity:.6}
.item.batal{cursor:default;opacity:1}
.item.batal .nm{text-decoration:line-through;text-decoration-thickness:2px;color:var(--faint);font-weight:600}
.item.batal .nm .q{color:var(--faint)}
.item.batal .thumb{filter:grayscale(1);opacity:.45}
.item.batal .mark{box-shadow:inset 0 0 0 2px var(--line-strong);opacity:.5}

/* ===== Tiket (ref3) ===== */
.ticket{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}
.t-head{padding:16px 18px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:center;border-bottom:1px solid var(--line)}
.t-id{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.t-no{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.t-time{font-size:30px;font-weight:800;text-align:right;line-height:1;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.t-time svg.i{width:22px;height:22px;color:var(--faint)}
.t-time.warn{color:var(--warn)} .t-time.warn svg.i{color:var(--warn)}
.t-meta{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ticket.warn{box-shadow:inset 0 0 0 2px var(--warn),var(--shadow)}
.ticket.warn .t-head{background:var(--warn-soft)}
.ticket.warn .t-head .pill.warn{background:var(--warn);color:var(--surface)}
.ticket.warn .t-head .pill:not(.warn):not(.alergi){background:var(--surface)}
.ticket.late{box-shadow:inset 0 0 0 3px var(--late),0 10px 30px color-mix(in srgb,var(--late) 25%,transparent)}
.ticket.late .t-head{background:var(--late);color:#fff;border-bottom:0}
.ticket.late .t-time,.ticket.late .t-time svg.i{color:#fff}
.ticket.late .t-head .kode{color:rgba(255,255,255,.85)}
.ticket.late .t-head .pill.late{background:#fff;color:var(--late)}
.ticket.late .t-head .pill.alergi{background:#7a0f22}
.ticket.late .t-head .pill:not(.late):not(.alergi){background:rgba(255,255,255,.92);color:#14201c}
.t-driver{margin:12px 14px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--warn-soft);color:var(--warn);border-radius:var(--radius-md);padding:10px 14px;font-size:15px;font-weight:700}
.t-driver .num{font-size:20px;font-weight:800}
.t-items{padding:10px 8px;flex:1}
.t-foot{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;padding:6px 14px 14px}
.t-foot button{min-height:56px;font-size:17px;font-weight:700}

/* ===== Variasi A: tiket per pesanan ===== */
.va{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;align-items:start}
.recent{margin-top:24px}
.recent .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.recent .hd h2{margin:0;font-size:18px;font-weight:800}
.olines{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 10px;margin:-4px;scrollbar-width:thin}
.oline{flex:0 0 220px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 8px;text-align:left;font-weight:400;align-items:center}
.oline b{font-size:20px;font-weight:800}
.oline .m{font-size:13px;color:var(--muted);font-weight:500;text-align:right}
.oline .ch{justify-self:start;font-size:13px}
.oline .go{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:14px;font-weight:700;color:var(--accent-strong)}

/* ===== Variasi B: per item per stasiun ===== */
.vb{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}
.stn{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.stn-h{background:var(--p);color:var(--on-pastel);padding:16px 18px;display:flex;align-items:center;gap:12px}
.stn-h .e{font-size:30px;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.6);display:grid;place-items:center;flex:none}
.stn-h h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;flex:1}
.stn-h .cnt{font-size:14px;font-weight:700;background:rgba(255,255,255,.7);padding:6px 12px;border-radius:999px;white-space:nowrap}
.stn-b{padding:10px 12px 14px}
.stn-b .grp{display:flex;align-items:center;gap:8px;margin:10px 6px 6px}
.agg-wrap{background:var(--surface-2);border-radius:var(--radius-md);padding:6px;margin-top:8px;border-left:5px solid var(--p)}
.agg{display:grid;grid-template-columns:64px minmax(0,1fr) 34px;gap:2px 12px;align-items:center;width:100%;text-align:left;border-radius:12px;background:transparent;padding:6px;font-weight:400}
.agg:hover:not(:disabled){background:var(--surface);filter:none}
.agg .big{grid-row:1/3;width:64px;height:64px;border-radius:16px;background:var(--surface);display:grid;place-items:center;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;box-shadow:var(--shadow-sm)}
.agg.dimasak .big{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.agg .nm{font-size:19px;font-weight:700;line-height:1.25}
.agg .nm .e{margin-right:6px}
.agg .mark{grid-column:3;grid-row:1/3}
.agg .sub{grid-column:2/4;color:var(--muted);font-size:15px;font-weight:500}
.agg .note{margin-top:4px}
.orders{display:flex;gap:6px;flex-wrap:wrap;padding:6px 6px 4px}
.ochip{min-height:40px;padding:4px 12px;font-size:14px;display:inline-flex;gap:8px;align-items:center;background:var(--surface);box-shadow:var(--shadow-sm);font-weight:600}
.ochip b{font-weight:800}
.ochip.warn{background:var(--warn-soft);color:var(--warn)}
.ochip.late{background:var(--late);color:#fff}
.ochip .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.ochip .dot.on{background:var(--warn)}
.ochip.late .dot{background:#fff}
.handoff{margin-top:20px;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.handoff .hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.handoff .hd h2{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.handoff .list{display:flex;gap:12px;overflow-x:auto;padding:12px 4px 4px;margin:0 -4px}

<script>
/* ===== Logika bersama (in-memory, prototipe) ===== */
const STATIONS = ["Wajan","Bakar","Kuah","Dingin","Bar"];
const ST_LOOK = { Wajan:["sand","🍳"], Bakar:["pink","🍗"], Kuah:["mint","🍲"], Dingin:["sky","🧊"], Bar:["sky","🧋"] };
const TARGET_MIN = 15, WARN_MIN = 10;          // Target Waktu Saji Outlet (default 15 menit)
const OJOL = ["GoFood","GrabFood","ShopeeFood"];
const MENU = [
  {name:"Nasi Goreng Kampung", st:"Wajan", e:"🍛", var:["Tidak pedas","Pedas","Extra pedas"], add:["Telur ceplok","Kerupuk"]},
  {name:"Mie Goreng Jawa", st:"Wajan", e:"🍜", var:["Tidak pedas","Pedas"]},
  {name:"Tahu Cabe Garam", st:"Wajan", e:"🌶️"},
  {name:"Pisang Goreng Keju", st:"Wajan", e:"🍌"},
  {name:"Kentang Goreng", st:"Wajan", e:"🍟"},
  {name:"Ayam Bakar Madu", st:"Bakar", e:"🍗", add:["Nasi putih","Sambal matah"]},
  {name:"Sate Ayam", st:"Bakar", e:"🍢", var:["Bumbu kecap","Bumbu kacang"]},
  {name:"Sop Buntut", st:"Kuah", e:"🍲"},
  {name:"Soto Ayam", st:"Kuah", e:"🍲", add:["Perkedel"]},
  {name:"Gado-gado", st:"Dingin", e:"🥗"},
  {name:"Asinan Bogor", st:"Dingin", e:"🥒"},
  {name:"Es Teh", st:"Bar", e:"🧋", var:["Manis","Tawar","Less sugar"]},
  {name:"Es Jeruk", st:"Bar", e:"🍊"},
  {name:"Es Kopi Susu", st:"Bar", e:"☕", var:["Normal","Less sugar"]},
];
const stOf = n => MENU.find(m=>m.name===n).st;
const emo = n => (MENU.find(m=>m.name===n)||{}).e || "🍽️";
const pc = st => "p-" + ST_LOOK[st][0];

const T0 = Date.now();
const S = {
  offset: 0, online: true, st: "Semua", drawer: false,
  nextNo: 43, seq: 0, undo: null,
  orders: [],
};
const now = () => Date.now() + S.offset;
const ago = min => T0 - min*60000;
let uid = 0; const id = p => p + (++uid);

function mkItem(name, qty, o={}){
  return { id:id("i"), name, st:stOf(name), qty, varian:o.varian||null, addons:o.addons||[], catatan:o.catatan||null, alergi:o.alergi||null, status:o.status||"baru", batal:!!o.batal };
}
function mkOrder(no, kanal, extra, items){
  return Object.assign({ id:id("o"), no, kanal, meja:null, nama:null, kode:null, created:now(), driverAt:null, bumpedAt:null, recalled:false, items }, extra);
}

/* Data awal: 7 pesanan aktif + 2 yang baru selesai (untuk recall) */
S.orders = [
  mkOrder(34,"Dine-in",{meja:"C1",created:ago(31),bumpedAt:ago(9)},[mkItem("Soto Ayam",2,{status:"siap"}),mkItem("Es Teh",2,{varian:"Manis",status:"siap"})]),
  mkOrder(35,"GoFood",{kode:"F-48177",created:ago(24),bumpedAt:ago(4)},[mkItem("Sate Ayam",1,{varian:"Bumbu kacang",status:"siap"})]),
  mkOrder(36,"Dine-in",{meja:"A2",created:ago(13.2)},[
    mkItem("Nasi Goreng Kampung",2,{varian:"Pedas",status:"dimasak"}),
    mkItem("Sop Buntut",1,{status:"siap"}),
    mkItem("Es Teh",2,{varian:"Less sugar",status:"siap"})]),
  mkOrder(37,"GoFood",{kode:"F-48213",created:ago(13.7),driverAt:ago(3.2)},[
    mkItem("Ayam Bakar Madu",1,{addons:["Nasi putih","Sambal matah"],status:"dimasak"}),
    mkItem("Mie Goreng Jawa",1,{varian:"Pedas"}),
    mkItem("Es Jeruk",1,{status:"siap"})]),
  mkOrder(38,"Takeaway",{nama:"Rina",created:ago(9.4)},[
    mkItem("Mie Goreng Jawa",2,{varian:"Tidak pedas",catatan:"Tanpa bawang"}),
    mkItem("Pisang Goreng Keju",1),
    mkItem("Kentang Goreng",1,{batal:true})]),
  mkOrder(39,"Dine-in",{meja:"B4",created:ago(7.1)},[
    mkItem("Ayam Bakar Madu",1,{addons:["Nasi putih"]}),
    mkItem("Tahu Cabe Garam",1,{alergi:"Kacang",catatan:"Pakai wajan & minyak bersih"}),
    mkItem("Es Teh",1,{varian:"Tawar"})]),
  mkOrder(40,"GrabFood",{kode:"A-77120",created:ago(5.3)},[
    mkItem("Nasi Goreng Kampung",1,{varian:"Extra pedas",addons:["Telur ceplok"]}),
    mkItem("Es Kopi Susu",1,{varian:"Less sugar"})]),
  mkOrder(41,"ShopeeFood",{kode:"SF-30951",created:ago(2.6)},[
    mkItem("Soto Ayam",2,{addons:["Perkedel"]}),
    mkItem("Gado-gado",1),
    mkItem("Es Jeruk",2)]),
  mkOrder(42,"Dine-in",{meja:"A5",created:ago(0.8)},[
    mkItem("Nasi Goreng Kampung",1,{varian:"Pedas"}),
    mkItem("Sop Buntut",1),
    mkItem("Es Kopi Susu",2,{varian:"Normal"})]),
];

const O = oid => S.orders.find(o=>o.id===oid);
const isOjol = o => OJOL.includes(o.kanal);
const live = o => o.items.filter(i=>!i.batal);
const elapsed = o => now() - o.created;
function level(o){ const m = elapsed(o)/60000; return m >= TARGET_MIN ? "late" : m >= WARN_MIN ? "warn" : "ok"; }
function orderState(o){
  const l = live(o);
  if(l.every(i=>i.status==="siap")) return "siap";
  if(l.every(i=>i.status==="baru")) return "baru";
  return "dimasak";
}
const active = () => S.orders.filter(o=>!o.bumpedAt).sort((a,b)=>a.created-b.created);
const recent = () => S.orders.filter(o=>o.bumpedAt).sort((a,b)=>b.bumpedAt-a.bumpedAt).slice(0,8);
const inSt = (i, st) => st==="Semua" || i.st===st;
const hasAlergi = o => live(o).some(i=>i.alergi);
const kanalLabel = o => o.kanal==="Dine-in" ? "Meja " + o.meja : o.kanal==="Takeaway" ? "Bawa pulang" + (o.nama ? " · " + o.nama : "") : o.kanal;

function snapshot(o){ S.undo = { oid:o.id, snap: JSON.stringify(o) }; }
function undo(){ if(!S.undo) return null; const o = O(S.undo.oid); Object.assign(o, JSON.parse(S.undo.snap)); S.undo = null; return o; }

const NEXT = { baru:"dimasak", dimasak:"siap", siap:"baru" };
function cycleItem(oid, iid){ const o = O(oid); const i = o.items.find(x=>x.id===iid); if(!i || i.batal) return; i.status = NEXT[i.status]; }
function setItems(o, st, from, to){ live(o).filter(i=>inSt(i,st) && from.includes(i.status)).forEach(i=>i.status = to); }
function startOrder(oid, st){ setItems(O(oid), st, ["baru"], "dimasak"); }
/* Siap: tandai item (stasiun terpilih) siap; pesanan keluar layar hanya bila semua item siap */
function readyOrder(oid, st){ const o = O(oid); snapshot(o); setItems(o, st, ["baru","dimasak"], "siap"); if(orderState(o)==="siap") bump(oid); return o; }
function bump(oid){ const o = O(oid); o.bumpedAt = now(); o.recalled = false; }
function recall(oid){ const o = O(oid); o.bumpedAt = null; o.recalled = true; }
function advanceGroup(refs){ refs.forEach(([oid,iid])=>{ const i = O(oid).items.find(x=>x.id===iid); if(i.status!=="siap") i.status = NEXT[i.status]; }); }
function driverArrives(){ const c = active().filter(o=>isOjol(o) && !o.driverAt); if(c.length){ c[0].driverAt = now(); return c[0]; } return null; }

const pick = a => a[Math.floor(Math.random()*a.length)];
function addRandomOrder(){
  const kanal = pick(["Dine-in","Dine-in","Takeaway","GoFood","GrabFood","ShopeeFood"]);
  const extra = kanal==="Dine-in" ? {meja: pick(["A","B","C"]) + (1+Math.floor(Math.random()*8))}
    : kanal==="Takeaway" ? {nama: pick(["Dewi","Agus","Sari","Bayu"])}
    : {kode: ({GoFood:"F-",GrabFood:"A-",ShopeeFood:"SF-"})[kanal] + (10000+Math.floor(Math.random()*89999))};
  const n = 1 + Math.floor(Math.random()*4), items = [];
  for(let k=0;k<n;k++){ const m = pick(MENU); items.push(mkItem(m.name, 1+Math.floor(Math.random()*2), {varian: m.var ? pick(m.var) : null, addons: m.add && Math.random()<.4 ? [pick(m.add)] : []})); }
  if(Math.random()<.25) items[0].catatan = pick(["Tanpa bawang","Sambal dipisah","Kuah dipisah"]);
  const o = mkOrder(S.nextNo++, kanal, extra, items); S.orders.push(o); return o;
}
function counts(){
  const a = active();
  return { aktif:a.length, telat:a.filter(o=>level(o)==="late").length, driver:a.filter(o=>o.driverAt).length,
    antre:a.reduce((n,o)=>n+live(o).filter(i=>i.status!=="siap").length,0) };
}
/* Rata-rata saji: dari masuk sampai ditandai selesai, untuk pesanan yang sudah selesai */
function avgServe(){ const d = S.orders.filter(o=>o.bumpedAt); if(!d.length) return null; return d.reduce((n,o)=>n+(o.bumpedAt-o.created),0)/d.length; }

/* ===== Tampilan bersama ===== */
const fmt = ms => { const s = Math.max(0, Math.floor(ms/1000)), m = Math.floor(s/60), r = s%60; return m + ":" + String(r).padStart(2,"0"); };
const clock = () => new Date(now()).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).replace(/\./g,":");
const dis = () => S.online ? "" : "disabled";

const ICONS = {
  layers:'<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  bike:'<circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/>',
  timer:'<line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>',
  history:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  wifioff:'<path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>',
  bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

const CH = { "Dine-in":["dine","🍽️"], "Takeaway":["take","🛍️"], "GoFood":["gofood","🛵"], "GrabFood":["grabfood","🛵"], "ShopeeFood":["shopeefood","🧡"] };
const chBadge = o => `<span class="ch ${CH[o.kanal][0]}"><span aria-hidden="true">${CH[o.kanal][1]}</span>${kanalLabel(o)}</span>`;
const STATE_PILL = { baru:["antre","Antre"], dimasak:["dimasak","Dimasak"], siap:["siap","Siap"] };
const statePill = o => { const [c,t] = STATE_PILL[orderState(o)]; return `<span class="pill ${c}">${t}</span>`; };

function header(){
  const c = counts(), avg = avgServe();
  const stCount = st => active().reduce((n,o)=>n + live(o).filter(i=>i.st===st && i.status!=="siap").length, 0);
  const avgMin = avg==null ? null : avg/60000;
  const tile = st => st==="Semua"
    ? `<button class="tile all" data-act="st" data-st="Semua" data-key="st-Semua" aria-pressed="${S.st==="Semua"}"><span class="e" aria-hidden="true">🍽️</span><b>Semua</b><small><span class="num">${c.antre}</span> item</small></button>`
    : `<button class="tile ${pc(st)}" data-act="st" data-st="${st}" data-key="st-${st}" aria-pressed="${S.st===st}"><span class="e" aria-hidden="true">${ST_LOOK[st][1]}</span><b>${st}</b><small><span class="num">${stCount(st)}</span> antre</small></button>`;
  return `<header class="top">
    <div class="hello"><h1>Dapur Kemang 👨‍🍳</h1><p>Selamat siang, Chef Rina · target saji ${TARGET_MIN} menit</p></div>
    <div class="tools">
      <span class="clock num" data-clock>${clock()}</span>
      <span class="net ${S.online?"":"off"}"><i></i><span class="nt">${S.online?"Online":"Offline"}</span></span>
      <button class="recallbtn" data-act="drawer" data-key="drawer" aria-haspopup="dialog">${ic("history")}Recall <span class="badge num">${recent().length}</span></button>
    </div>
  </header>
  <section class="kpis" aria-label="Ringkasan dapur">
    <div class="kpi"><span class="ico acc">${ic("layers")}</span><span class="k">Pesanan aktif</span><span class="v num">${c.aktif}</span><span class="d mut"><span class="num">${c.antre}</span> item belum siap</span></div>
    <div class="kpi ${c.telat?"alarm":""}"><span class="ico dan">${ic("alert")}</span><span class="k">Terlambat</span><span class="v num">${c.telat}</span><span class="d ${c.telat?"bad":"ok"}">${c.telat?`Lewat ${TARGET_MIN} menit, dahulukan`:"✓ Semua tepat waktu"}</span></div>
    <div class="kpi"><span class="ico wrn">${ic("bike")}</span><span class="k">Driver menunggu</span><span class="v num">${c.driver}</span><span class="d ${c.driver?"warn":"mut"}">${c.driver?"Ojol sudah di depan":"Tidak ada yang menunggu"}</span></div>
    <div class="kpi"><span class="ico inf">${ic("timer")}</span><span class="k">Rata-rata saji</span><span class="v num">${avgMin==null?"–":Math.round(avgMin)}<small>mnt</small></span><span class="d ${avgMin==null?"mut":avgMin<=TARGET_MIN?"ok":"bad"}">${avgMin==null?"Belum ada data":avgMin<=TARGET_MIN?`↓ di bawah target ${TARGET_MIN} mnt`:`↑ ${Math.round(avgMin-TARGET_MIN)} mnt di atas target`}</span></div>
  </section>
  <nav class="stations" aria-label="Filter stasiun">${["Semua",...STATIONS].map(tile).join("")}</nav>
  ${S.online ? "" : `<div class="offline" role="alert"><span class="ico">${ic("wifioff")}</span><span><b>Koneksi internet terputus.</b><span>Layar dapur tidak menerima pesanan baru. Gunakan tiket printer sampai koneksi pulih.</span></span></div>`}
  <div class="subbar">
    <h2>${VARIANTS[vi][3]}${S.st==="Semua"?"":` · ${S.st}`}</h2>
    <div class="demo" aria-label="Kontrol demo">
      <span class="label">Demo</span>
      <button data-act="rand" data-key="d-rand">+ Pesanan acak</button>
      <button data-act="driver" data-key="d-driver">Driver tiba</button>
      <button data-act="ff" data-key="d-ff">+5 menit</button>
      <button data-act="net" data-key="d-net">${S.online?"Putus koneksi":"Sambung lagi"}</button>
    </div>
  </div>`;
}

function itemRow(o, i){
  const sub = [i.varian, ...i.addons.map(a=>"+ " + a)].filter(Boolean).join(" · ");
  const lbl = i.batal ? "Dibatalkan" : i.status==="baru" ? "Baru" : i.status==="dimasak" ? "Dimasak" : "Siap";
  return `<button class="item ${i.status} ${i.batal?"batal":""} ${pc(i.st)}" ${i.batal?"disabled aria-disabled=\"true\"":dis()} data-act="item" data-o="${o.id}" data-i="${i.id}" data-key="it-${i.id}" aria-label="${i.qty} ${i.name}, ${lbl}. Ketuk untuk ubah status">
    <span class="thumb" aria-hidden="true">${emo(i.name)}</span>
    <span class="nm"><span class="q num">${i.qty}×</span>${i.name}</span>
    <span class="mark ${i.batal?"":i.status}">${i.status==="siap"&&!i.batal?ic("check"):""}</span>
    <span class="st">${i.batal?`<span class="pill batal">Batal</span>`:i.st}${sub?` · <span style="font-weight:500">${sub}</span>`:""}</span>
    ${i.catatan?`<span class="note">📝 ${i.catatan}</span>`:""}
    ${i.alergi?`<span class="alg">⚠️ Alergi ${i.alergi}</span>`:""}
  </button>`;
}

function ticketHead(o){
  const lv = level(o);
  return `<div class="t-head">
    <div class="t-id"><span class="t-no num">#${o.no}</span>${chBadge(o)}</div>
    <div class="t-time num ${lv}">${ic("timer")}<span data-since="${o.created}">${fmt(elapsed(o))}</span></div>
    <div class="t-meta">
      ${lv==="late"?`<span class="pill late">Terlambat</span>`:lv==="warn"?`<span class="pill warn">Mendekati ${TARGET_MIN} mnt</span>`:""}
      ${statePill(o)}
      ${hasAlergi(o)?`<span class="pill alergi">⚠️ Alergi</span>`:""}
      ${o.recalled?`<span class="pill recall">Dibuka lagi</span>`:""}
      ${o.kode?`<span class="kode num">${o.kode}</span>`:""}
    </div>
  </div>
  ${o.driverAt?`<div class="t-driver"><span>🛵 Driver menunggu</span><span class="num" data-since="${o.driverAt}">${fmt(now()-o.driverAt)}</span></div>`:""}`;
}

/* ===== Variasi A: tiket per pesanan ===== */
function VariantA(){
  const list = active().filter(o=>live(o).some(i=>inSt(i,S.st)) || S.st==="Semua");
  const stLbl = S.st==="Semua" ? "" : " " + S.st;
  const rec = recent().slice(0,5);
  return `<div class="va">${list.map(o=>{
    const its = o.items.filter(i=>inSt(i,S.st));
    const anyBaru = its.some(i=>!i.batal && i.status==="baru");
    return `<article class="ticket ${level(o)}" aria-label="Pesanan ${o.no}">
      ${ticketHead(o)}
      <div class="t-items">${its.map(i=>itemRow(o,i)).join("")}</div>
      <div class="t-foot">
        <button class="quiet" data-act="start" data-o="${o.id}" data-key="s-${o.id}" ${anyBaru?dis():"disabled"}>Mulai${stLbl}</button>
        <button class="primary" data-act="ready" data-o="${o.id}" data-key="r-${o.id}" ${dis()}>✓ Siap${stLbl}</button>
      </div>
    </article>`;}).join("") || `<p class="empty">Tidak ada pesanan untuk stasiun ini.</p>`}</div>
  <section class="recent" aria-label="Baru selesai">
    <div class="hd"><h2>Baru selesai</h2><span class="muted" style="font-size:14px;font-weight:500">Ketuk untuk buka lagi</span></div>
    <div class="olines">${rec.map(o=>`<button class="oline" data-act="recall" data-o="${o.id}" data-key="rc-${o.id}" ${dis()}>
      <b class="num">#${o.no}</b><span class="m"><span class="num">${live(o).length}</span> item<br><span class="num" data-since="${o.bumpedAt}">${fmt(now()-o.bumpedAt)}</span> lalu</span>
      ${chBadge(o)}<span class="pill siap">Selesai</span>
      <span class="go">Buka lagi ${ic("history")}</span></button>`).join("") || `<span class="muted">Belum ada</span>`}</div>
  </section>`;
}

/* ===== Variasi B: per item, dikelompokkan per stasiun ===== */
function groups(st){
  const map = new Map();
  active().forEach(o=>live(o).filter(i=>i.st===st && i.status!=="siap").forEach(i=>{
    const key = [i.status,i.name,i.varian,i.addons.join("+"),i.catatan,i.alergi,i.alergi||i.catatan?o.id:""].join("|");
    if(!map.has(key)) map.set(key,{status:i.status,name:i.name,varian:i.varian,addons:i.addons,catatan:i.catatan,alergi:i.alergi,qty:0,refs:[],oldest:o.created});
    const g = map.get(key); g.qty += i.qty; g.refs.push({o,i}); g.oldest = Math.min(g.oldest,o.created);
  }));
  return [...map.values()].sort((a,b)=>(b.alergi?1:0)-(a.alergi?1:0) || a.oldest-b.oldest);
}
function aggRow(g, gi, st){
  const sub = [g.varian, ...g.addons.map(a=>"+ "+a)].filter(Boolean).join(" · ");
  const refs = g.refs.map(r=>r.o.id+":"+r.i.id).join(",");
  return `<div class="agg-wrap">
    <button class="agg ${g.status}" data-act="grp" data-refs="${refs}" data-key="g-${st}-${g.status}-${gi}" ${dis()} aria-label="${g.qty} ${g.name}, ${g.status}. Ketuk untuk ${g.status==="baru"?"mulai masak":"tandai siap"}">
      <span class="big num">${g.qty}</span>
      <span class="nm"><span class="e" aria-hidden="true">${emo(g.name)}</span>${g.name}</span>
      <span class="mark ${g.status}"></span>
      ${sub?`<span class="sub">${sub}</span>`:""}
      ${g.catatan?`<span class="note">📝 ${g.catatan}</span>`:""}
      ${g.alergi?`<span class="alg">⚠️ Alergi ${g.alergi}</span>`:""}
    </button>
    <div class="orders">${g.refs.map(r=>`<button class="ochip ${level(r.o)}" data-act="item" data-o="${r.o.id}" data-i="${r.i.id}" data-key="oc-${r.i.id}" ${dis()} aria-label="Pesanan ${r.o.no}, ${r.i.qty} porsi">
      <b class="num">#${r.o.no}</b><span>${r.i.qty}×</span><span class="num" data-since="${r.o.created}">${fmt(elapsed(r.o))}</span>${isOjol(r.o)?`<span class="dot ${r.o.driverAt?"on":""}" title="Ojol"></span>`:""}</button>`).join("")}</div>
  </div>`;
}
function VariantB(){
  const sts = S.st==="Semua" ? STATIONS : [S.st];
  const ready = active().filter(o=>orderState(o)==="siap");
  return `<div class="vb">${sts.map(st=>{
    const gs = groups(st), baru = gs.filter(g=>g.status==="baru"), mas = gs.filter(g=>g.status==="dimasak");
    const tot = gs.reduce((n,g)=>n+g.qty,0);
    return `<section class="stn ${pc(st)}" aria-label="Stasiun ${st}">
      <div class="stn-h"><span class="e" aria-hidden="true">${ST_LOOK[st][1]}</span><h2>${st}</h2><span class="cnt"><span class="num">${tot}</span> porsi</span></div>
      <div class="stn-b">
      ${!gs.length?`<p class="empty">✨ Stasiun kosong</p>`:""}
      ${mas.length?`<h3 class="grp"><span class="pill dimasak">Dimasak</span></h3>${mas.map((g,k)=>aggRow(g,k,st)).join("")}`:""}
      ${baru.length?`<h3 class="grp"><span class="pill antre">Antre</span></h3>${baru.map((g,k)=>aggRow(g,k,st)).join("")}`:""}
      </div>
    </section>`;}).join("")}</div>
  <section class="handoff" aria-label="Siap diserahkan">
    <div class="hd"><h2>Siap diserahkan <span class="pill siap"><span class="num">${ready.length}</span></span></h2><span class="muted" style="font-size:14px;font-weight:500">Semua item selesai</span></div>
    <div class="list">${ready.map(o=>`<button class="hcard" data-act="bump" data-o="${o.id}" data-key="b-${o.id}" ${dis()}><b class="num">#${o.no}</b><span class="pill siap">Siap</span>${chBadge(o)}<span class="kode num">${o.kode||""}</span><span class="go">Ketuk saat diserahkan →</span></button>`).join("") || `<span class="muted" style="padding:8px 4px">Belum ada pesanan yang lengkap.</span>`}</div>
  </section>`;
}

/* ===== Variasi C: lajur status (kanban) ===== */
function card(o, lane){
  const action = lane==="baru" ? ["start","Mulai masak","ink"] : lane==="dimasak" ? ["ready","✓ Semua siap","primary"] : ["bump", isOjol(o)?"Diambil driver":o.kanal==="Dine-in"?"Diantar ke meja":"Diambil", "primary"];
  return `<article class="ticket card ${level(o)}" aria-label="Pesanan ${o.no}">
    ${ticketHead(o)}
    <div class="t-items">${o.items.map(i=>itemRow(o,i)).join("")}</div>
    <div class="t-foot"><button class="${action[2]}" data-act="${action[0]}" data-o="${o.id}" data-all="1" data-key="c-${o.id}" ${dis()}>${action[1]}</button></div>
  </article>`;
}
function VariantC(){
  const a = active().filter(o=>live(o).some(i=>inSt(i,S.st)) || S.st==="Semua");
  const waiting = active().filter(o=>isOjol(o) && o.driverAt).sort((x,y)=>x.driverAt-y.driverAt);
  const OJ_P = { GoFood:"p-mint", GrabFood:"p-mint", ShopeeFood:"p-peach" };
  const lane = (key,title) => { const l = a.filter(o=>orderState(o)===key); return `<section class="lane ${key}" aria-label="${title}">
    <div class="lane-h"><span class="ln">${title}</span><span class="n num">${l.length}</span></div>
    <div class="cards">${l.map(o=>card(o,key)).join("") || `<p class="empty">Kosong</p>`}</div></section>`; };
  return `${waiting.length?`<section class="strip" aria-label="Ojol menunggu driver">
    <div class="hd"><h2>🛵 Driver sudah menunggu <span class="pill dimasak"><span class="num">${waiting.length}</span></span></h2><span class="muted" style="font-size:14px;font-weight:500">Dahulukan pesanan ini</span></div>
    <div class="list">${waiting.map(o=>{ const l = live(o), done = l.filter(i=>i.status==="siap").length; return `<button class="ojol ${OJ_P[o.kanal]}" data-act="focus" data-o="${o.id}" data-key="oj-${o.id}">
      <span><span class="who">${o.kanal} · #${o.no}</span><br><span class="kd num">${o.kode}</span></span>
      <span class="w num">${ic("bike")}<span data-since="${o.driverAt}">${fmt(now()-o.driverAt)}</span></span>
      <span class="s"><span class="num">${done}/${l.length}</span> item siap</span><span class="tt num ${level(o)}" data-since="${o.created}">${fmt(elapsed(o))}</span>
      <span class="bar"><i style="width:${Math.round(done/l.length*100)}%"></i></span></button>`;}).join("")}</div>
  </section>`:""}
  <div class="vc">${lane("baru","Baru")}${lane("dimasak","Dimasak")}${lane("siap","Siap · menunggu diambil")}</div>`;
}

function drawer(){
  if(!S.drawer) return "";
  return `<div class="scrim" data-act="close"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dh">
    <div class="hd"><h2 id="dh">${ic("history")}Recall pesanan</h2><button class="quiet" data-act="close" data-key="close" id="dclose">Tutup</button></div>
    <p class="muted" style="margin:8px 0 0;font-weight:500">Pesanan yang baru ditandai selesai. Ketuk “Buka lagi” untuk mengembalikannya ke layar.</p>
    <div class="list">${recent().map(o=>`<div class="rc"><b class="num">#${o.no}</b><span>${chBadge(o)}<span class="s">${o.kode?o.kode+" · ":""}Selesai ${fmt(now()-o.bumpedAt)} lalu · ${live(o).length} item</span></span>
      <button class="ink" data-act="recall" data-o="${o.id}" data-key="rc-${o.id}" ${dis()}>Buka lagi</button></div>`).join("") || `<p class="empty">Belum ada pesanan selesai.</p>`}</div>
  </aside>`;
}

let toastT;
function toast(msg, withUndo){
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${msg}</span>${withUndo?`<button data-act="undo">Urungkan</button>`:""}`;
  el.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ el.hidden = true; S.undo = null; }, 5000);
}

/* ===== Pemilih variasi (bagian prototipe) ===== */
const VARIANTS = [["A","Tiket per pesanan",VariantA,"Tiket aktif"],["B","Per item per stasiun",VariantB,"Antrean per stasiun"],["C","Lajur status",VariantC,"Alur pesanan"]];
let vi = Math.max(0, VARIANTS.findIndex(v=>"#"+v[0]===location.hash));
let sig = "";
function signature(){ return active().map(o=>o.id+level(o)).join(",") + S.online; }
function render(){
  const [k,name,fn] = VARIANTS[vi];
  const fk = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.key;
  document.body.classList.toggle("is-offline", !S.online);
  document.getElementById("app").innerHTML = header() + `<main class="view-${k.toLowerCase()}">${fn()}</main>`;
  document.getElementById("layer").innerHTML = drawer();
  document.getElementById("vlabel").textContent = `${k} · ${name}`;
  sig = signature();
  if(fk){ const el = document.querySelector(`[data-key="${fk}"]`); if(el && !el.disabled) el.focus({preventScroll:true}); }
}
function go(d){ vi = (vi+d+VARIANTS.length)%VARIANTS.length; history.replaceState(null,"","#"+VARIANTS[vi][0]); render(); }

const A = {
  item: d => { cycleItem(d.o, d.i); render(); },
  start: d => { startOrder(d.o, d.all ? "Semua" : S.st); render(); },
  ready: d => { const o = readyOrder(d.o, d.all ? "Semua" : S.st); render(); toast(o.bumpedAt ? `Pesanan #${o.no} selesai` : `Item ${S.st} pesanan #${o.no} siap`, true); },
  bump: d => { const o = O(d.o); snapshot(o); bump(d.o); render(); toast(`Pesanan #${o.no} diserahkan`, true); },
  grp: d => { advanceGroup(d.refs.split(",").map(x=>x.split(":"))); render(); },
  recall: d => { recall(d.o); const o = O(d.o); S.drawer = false; render(); toast(`Pesanan #${o.no} dibuka kembali`); },
  undo: () => { const o = undo(); document.getElementById("toast").hidden = true; if(o){ render(); } },
  st: d => { S.st = d.st; render(); },
  drawer: () => { S.drawer = true; render(); const c = document.getElementById("dclose"); c && c.focus(); },
  close: () => { S.drawer = false; render(); const b = document.querySelector('[data-key="drawer"]'); b && b.focus(); },
  focus: d => { const el = document.querySelector(`[aria-label="Pesanan ${O(d.o).no}"]`); if(el){ el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"}); const b = el.querySelector("button:not(:disabled)"); b && b.focus({preventScroll:true}); } },
  rand: () => { if(!S.online){ toast("Offline: pesanan baru hanya keluar di printer dapur"); return; } const o = addRandomOrder(); render(); toast(`Pesanan baru #${o.no} · ${kanalLabel(o)}`); },
  driver: () => { const o = driverArrives(); render(); toast(o ? `Driver ${o.kanal} tiba untuk ${o.kode}` : "Semua pesanan ojol sudah ditunggu driver"); },
  ff: () => { S.offset += 5*60000; render(); toast("Waktu dimajukan 5 menit"); },
  net: () => { S.online = !S.online; render(); },
};
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if(!el || el.disabled) return; const f = A[el.dataset.act]; f && f(el.dataset); });
document.addEventListener("keydown", e => {
  const t = e.target; if(t.closest && t.closest("input,textarea,select,[contenteditable]")) return;
  if(S.drawer){ if(e.key==="Escape") A.close(); return; }
  if(e.key==="ArrowLeft") go(-1); if(e.key==="ArrowRight") go(1);
});
/* Detak 1 detik: perbarui pengatur waktu di tempat; render ulang hanya bila status terlambat berubah */
setInterval(() => {
  if(signature() !== sig){ render(); return; }
  document.querySelectorAll("[data-since]").forEach(el => el.textContent = fmt(now() - Number(el.dataset.since)));
  const c = document.querySelector("[data-clock]"); if(c) c.textContent = clock();
}, 1000);
render();
</script>
