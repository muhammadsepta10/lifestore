<title>Prototipe Dapur Lifestore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Lifestore: token desain bersama (modern, minimalis). Satu aksen hijau daun, netral sedikit kehijauan, garis tipis, tanpa bayangan berat. */
:root{
  --bg:#f7f8f7; --surface:#ffffff; --surface-2:#f0f2f0; --line:#e3e7e3; --line-strong:#cfd6cf;
  --fg:#111814; --muted:#66736b; --faint:#9aa59e;
  --accent:#127a5f; --accent-ink:#ffffff; --accent-soft:#e3f2ec;
  --warn:#b26b00; --warn-soft:#fff3df; --danger:#c2364d; --danger-soft:#fde8ec; --ok:#2e7d4f; --ok-soft:#e5f4ea;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(17,24,20,.04), 0 8px 24px rgba(17,24,20,.06);
  --f-ui:"Geist", "Segoe UI", system-ui, sans-serif;
  --f-num:"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c100e; --surface:#141917; --surface-2:#1b211e; --line:#252d29; --line-strong:#334039;
  --fg:#eef2ef; --muted:#9aa79f; --faint:#6b776f;
  --accent:#4cc39d; --accent-ink:#06120d; --accent-soft:#16302a;
  --warn:#f2b250; --warn-soft:#33270f; --danger:#f2879a; --danger-soft:#3a1c23; --ok:#7dd3a0; --ok-soft:#163023;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c100e; --surface:#141917; --surface-2:#1b211e; --line:#252d29; --line-strong:#334039;
  --fg:#eef2ef; --muted:#9aa79f; --faint:#6b776f;
  --accent:#4cc39d; --accent-ink:#06120d; --accent-soft:#16302a;
  --warn:#f2b250; --warn-soft:#33270f; --danger:#f2879a; --danger-soft:#3a1c23; --ok:#7dd3a0; --ok-soft:#163023;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
/* Font: <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap"> */

/* Layout: layar dapur (tablet/TV landscape), dibaca dari 1–2 m, disentuh dengan jari berminyak. Tiga variasi di atas satu data. */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:16px calc(104px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius-sm);padding:10px 16px;min-height:48px;transition:border-color .15s,background .15s}
button:hover:not(:disabled){border-color:var(--fg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover:not(:disabled){border-color:var(--accent);filter:brightness(1.06)}
button.quiet{background:transparent;border-color:var(--line)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--faint);flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.late{background:var(--danger)} .dot.acc{background:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.late{border-color:var(--danger);color:var(--danger)}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.tag.alergi{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.tag.acc{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--faint);padding:24px 0;text-align:center}

/* Kepala layar */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.clock{font-size:22px}
.stats{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.stat{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.stat b{color:var(--fg);font-size:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border-radius:999px;padding:8px 18px;font-weight:500;border-color:var(--line)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips button .num{color:inherit;opacity:.6;margin-left:6px}
.demo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border:1px dashed var(--line-strong);border-radius:var(--radius-sm);padding:4px 6px 4px 10px}
.demo .label{font-size:11px;margin-right:4px}
.demo button{min-height:34px;padding:4px 10px;font-size:13px;border-color:var(--line);background:transparent}
.offline{display:flex;gap:16px;align-items:center;border:1px solid var(--danger);background:var(--danger-soft);color:var(--fg);border-radius:var(--radius);padding:14px 18px;margin-bottom:20px}
.offline b{color:var(--danger)}
.is-offline main{opacity:.55}

/* Item pesanan (dipakai semua variasi) */
.item{display:grid;grid-template-columns:28px 1fr auto;gap:2px 12px;align-items:start;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:12px 4px;min-height:56px}
.item:first-child{border-top:0}
.item:hover:not(:disabled){background:var(--surface-2)}
.item .nm{font-size:18px;font-weight:600;line-height:1.3}
.item .nm .q{font-family:var(--f-num);font-variant-numeric:tabular-nums;margin-right:6px}
.item .st{font-size:13px;color:var(--faint);padding-top:4px}
.item .sub{grid-column:2/4;font-size:15px;color:var(--muted)}
.item .note{grid-column:2/4;font-size:15px;color:var(--fg);border-left:2px solid var(--warn);padding-left:10px;margin-top:4px}
.item .alg{grid-column:1/4;margin-top:8px;background:var(--danger-soft);border:1px solid var(--danger);border-left-width:6px;border-radius:8px;padding:8px 12px;color:var(--danger);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);margin-top:2px;display:grid;place-items:center;font-size:13px;font-weight:700}
.mark.dimasak{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
.mark.siap{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.item.siap .nm{color:var(--muted);font-weight:500}
.item.batal{cursor:default}
.item.batal .nm{text-decoration:line-through;color:var(--faint);font-weight:500}
.item.batal .mark{border-style:dashed}

/* Tiket */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}
.ticket::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--line)}
.ticket.warn::before{background:var(--warn)}
.ticket.late{border-color:var(--danger)}
.ticket.late::before{background:var(--danger);height:4px}
.t-head{padding:18px 18px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.t-no{font-family:var(--f-num);font-size:28px;font-weight:500;letter-spacing:-.03em;line-height:1}
.t-kanal{font-size:16px;font-weight:600}
.t-kode{font-family:var(--f-num);font-size:16px;color:var(--fg)}
.t-time{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:24px;text-align:right;line-height:1}
.t-time.warn{color:var(--warn)} .t-time.late{color:var(--danger)}
.t-meta{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.t-driver{margin:0 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--warn);border-radius:var(--radius-sm);padding:8px 12px;font-size:15px;font-weight:600;color:var(--warn)}
.t-items{padding:0 14px;flex:1}
.t-foot{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;padding:14px 18px 18px}
.t-foot button{min-height:56px;font-size:17px}

/* Variasi A: tiket per pesanan */
.va{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.recent{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.recent button{min-height:48px;border-color:var(--line);background:transparent}

/* Variasi B: per item per stasiun */
.vb{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.stn{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.stn h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.stn h3{margin:18px 0 6px}
.agg{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:14px 4px}
.agg:hover:not(:disabled){background:var(--surface-2)}
.agg .line1{display:flex;align-items:baseline;gap:12px}
.agg .big{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:26px;line-height:1;min-width:2.2ch}
.agg .nm{font-size:18px;font-weight:600;flex:1}
.agg .sub{margin:4px 0 0 calc(2.2ch * 1.2 + 12px);color:var(--muted);font-size:15px}
.agg .note{margin:6px 0 0 calc(2.2ch * 1.2 + 12px);border-left:2px solid var(--warn);padding-left:10px;font-size:15px}
.agg .alg{margin:8px 0 0;background:var(--danger-soft);border:1px solid var(--danger);border-left-width:6px;border-radius:8px;padding:8px 12px;color:var(--danger);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.agg.dimasak .big{color:var(--accent)}
.orders{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0 calc(2.2ch * 1.2 + 12px)}
.ochip{min-height:40px;padding:4px 10px;border-radius:999px;font-size:14px;display:inline-flex;gap:8px;align-items:center;border-color:var(--line);background:var(--surface)}
.ochip .num{font-size:14px}
.ochip.late{border-color:var(--danger);color:var(--danger)}
.ochip.warn{border-color:var(--warn);color:var(--warn)}
.handoff{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.handoff .list{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.handoff button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:160px;text-align:left;padding:12px 16px}
.handoff button b{font-family:var(--f-num);font-size:22px;font-weight:500}

/* Variasi C: lajur status */
.strip{border:1px solid var(--warn);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;background:var(--surface)}
.strip .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.ojol{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:12px 14px;border-color:var(--line)}
.ojol .kode{font-family:var(--f-num);font-size:24px;line-height:1.1}
.ojol .w{font-family:var(--f-num);font-size:20px;color:var(--warn);text-align:right}
.ojol .bar{grid-column:1/3;height:4px;border-radius:2px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.ojol .bar i{display:block;height:100%;background:var(--ok)}
.vc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.lane{min-width:0}
.lane-h{display:flex;align-items:center;gap:10px;padding:0 4px 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.lane-h b{font-size:18px}
.lane-h .num{color:var(--muted);font-size:16px}
.lane .cards{display:flex;flex-direction:column;gap:12px}
.card .t-head{padding:16px 16px 8px}
.card .t-no{font-size:24px}
.card .t-time{font-size:20px}
.card .t-items{padding:0 12px}
.card .item{padding:10px 4px;min-height:48px}
.card .item .nm{font-size:16px}
.card .t-foot{grid-template-columns:1fr;padding:12px 16px 16px}

/* Laci recall */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 30%,transparent);z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:71;display:flex;flex-direction:column;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.drawer h2{margin:0;font-size:20px}
.drawer .list{overflow:auto;margin-top:16px;display:flex;flex-direction:column}
.rc{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;border-top:1px solid var(--line);padding:14px 2px}
.rc b{font-family:var(--f-num);font-size:22px;font-weight:500}
.rc .s{font-size:14px;color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 8px 8px 18px;border-radius:var(--radius-sm);z-index:80;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;font-weight:500}
.toast button{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent);min-height:40px;padding:6px 14px}
.toast:not(:has(button)){padding-right:18px;min-height:56px}

/* Bilah pemilih variasi (bagian prototipe, bukan desain) */
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:999px;display:flex;align-items:center;gap:2px;padding:4px;box-shadow:var(--shadow);z-index:60;max-width:calc(100% - 32px)}
.switcher button{background:transparent;border:0;color:var(--bg);font-weight:600;min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;font-size:20px;line-height:1}
.switcher button:hover{background:color-mix(in srgb,var(--bg) 15%,transparent)}
.switcher button:focus-visible{outline-color:var(--bg)}
.switcher span{font-weight:600;font-size:14px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (max-width:900px){.vc{grid-template-columns:1fr}}
@media (max-width:520px){
  .va,.vb{grid-template-columns:minmax(0,1fr)}
  .t-no{font-size:24px}
  .stats{gap:14px}
  .offline{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* Palet berwarna terinspirasi aplikasi modern minimalis: Toast POS (oranye hangat), Wise (hijau limau), Stripe (indigo-cyan). "polos" = token asli. */
:root[data-palette="hangat"]{--bg:#fbf7f3;--surface:#ffffff;--surface-2:#f5ede6;--line:#ece1d7;--line-strong:#dccbbd;--fg:#1f1410;--muted:#6f5d52;--faint:#a8968a;--accent:#e5480b;--accent-ink:#ffffff;--accent-soft:#ffe7dc;--accent-2:#ffb020}
:root[data-palette="limau"]{--bg:#f3f6ef;--surface:#ffffff;--surface-2:#e9efe2;--line:#dde6d3;--line-strong:#c4d3b5;--fg:#163300;--muted:#55693f;--faint:#94a684;--accent:#1f4a00;--accent-ink:#c7f59e;--accent-soft:#dcf7c4;--accent-2:#9fe870}
:root[data-palette="indigo"]{--bg:#f6f9fc;--surface:#ffffff;--surface-2:#eef2f8;--line:#e3e8ef;--line-strong:#cfd7e3;--fg:#0a2540;--muted:#425466;--faint:#8898aa;--accent:#635bff;--accent-ink:#ffffff;--accent-soft:#ecebff;--accent-2:#00d4ff}
@media (prefers-color-scheme: dark){
:root[data-palette="hangat"]:not([data-theme="light"]){--bg:#16100c;--surface:#1f1712;--surface-2:#2a1f18;--line:#36291f;--line-strong:#4a382b;--fg:#fbefe7;--muted:#c4ab9b;--faint:#866f61;--accent:#ff7a45;--accent-ink:#1a0a03;--accent-soft:#43200f;--accent-2:#ffc054}
:root[data-palette="limau"]:not([data-theme="light"]){--bg:#0e1a07;--surface:#15240c;--surface-2:#1c2f11;--line:#263d18;--line-strong:#345221;--fg:#ecf7e2;--muted:#a9c194;--faint:#6f8a5d;--accent:#9fe870;--accent-ink:#163300;--accent-soft:#24410f;--accent-2:#9fe870}
:root[data-palette="indigo"]:not([data-theme="light"]){--bg:#0a1628;--surface:#0f1f36;--surface-2:#152844;--line:#1e3352;--line-strong:#2b4467;--fg:#f0f4fa;--muted:#a3b3c7;--faint:#6b7f99;--accent:#8f88ff;--accent-ink:#0a0a2a;--accent-soft:#24245a;--accent-2:#4fe0ff}}
:root[data-palette="hangat"][data-theme="dark"]{--bg:#16100c;--surface:#1f1712;--surface-2:#2a1f18;--line:#36291f;--line-strong:#4a382b;--fg:#fbefe7;--muted:#c4ab9b;--faint:#866f61;--accent:#ff7a45;--accent-ink:#1a0a03;--accent-soft:#43200f;--accent-2:#ffc054}
:root[data-palette="limau"][data-theme="dark"]{--bg:#0e1a07;--surface:#15240c;--surface-2:#1c2f11;--line:#263d18;--line-strong:#345221;--fg:#ecf7e2;--muted:#a9c194;--faint:#6f8a5d;--accent:#9fe870;--accent-ink:#163300;--accent-soft:#24410f;--accent-2:#9fe870}
:root[data-palette="indigo"][data-theme="dark"]{--bg:#0a1628;--surface:#0f1f36;--surface-2:#152844;--line:#1e3352;--line-strong:#2b4467;--fg:#f0f4fa;--muted:#a3b3c7;--faint:#6b7f99;--accent:#8f88ff;--accent-ink:#0a0a2a;--accent-soft:#24245a;--accent-2:#4fe0ff}
/* Sentuhan warna: cahaya lembut di atas halaman, kepala halaman bergradasi, tombol utama bergradasi */
:root:not([data-palette="polos"]) body{background:radial-gradient(900px 360px at 10% -120px,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),radial-gradient(700px 300px at 95% -100px,color-mix(in srgb,var(--accent-2) 16%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
:root:not([data-palette="polos"]) :is(.top,.topbar,.hd){background:linear-gradient(120deg,var(--accent-soft),color-mix(in srgb,var(--accent-2) 20%,var(--surface)));border:0;border-radius:var(--radius);padding:14px 18px}
:root:not([data-palette="polos"]) :is(button.primary,.btn.primary){background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 72%,var(--accent-2)));border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 28%,transparent)}
[hidden]{display:none!important}
.palet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:6px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.palet.atas{bottom:auto;left:auto;right:max(12px,calc(50% - 203px));transform:none;top:calc(var(--top) + 8px)}
.palet button{width:22px;height:22px;min-height:0;min-width:0;padding:0;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);cursor:pointer}
.palet button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
</style>

<div id="app"></div>
<div id="layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<nav class="switcher" aria-label="Pilih variasi prototipe">
  <button id="prev" aria-label="Variasi sebelumnya">‹</button>
  <span id="vlabel"></span>
  <button id="next" aria-label="Variasi berikutnya">›</button>
</nav>

<script>
/* ===== Logika bersama (in-memory, prototipe) ===== */
const STATIONS = ["Wajan","Bakar","Kuah","Dingin","Bar"];
const TARGET_MIN = 15, WARN_MIN = 10;          // Target Waktu Saji Outlet (default 15 menit)
const OJOL = ["GoFood","GrabFood","ShopeeFood"];
const MENU = [
  {name:"Nasi Goreng Kampung", st:"Wajan", var:["Tidak pedas","Pedas","Extra pedas"], add:["Telur ceplok","Kerupuk"]},
  {name:"Mie Goreng Jawa", st:"Wajan", var:["Tidak pedas","Pedas"]},

const O = oid => S.orders.find(o=>o.id===oid);
const isOjol = o => OJOL.includes(o.kanal);
const live = o => o.items.filter(i=>!i.batal);
const elapsed = o => now() - o.created;
function level(o){ const m = elapsed(o)/60000; return m >= TARGET_MIN ? "late" : m >= WARN_MIN ? "warn" : "ok"; }
function orderState(o){
  const l = live(o);
  if(l.every(i=>i.status==="siap")) return "siap";
  if(l.every(i=>i.status==="baru")) return "baru";
  return "dimasak";
}
const active = () => S.orders.filter(o=>!o.bumpedAt).sort((a,b)=>a.created-b.created);
const recent = () => S.orders.filter(o=>o.bumpedAt).sort((a,b)=>b.bumpedAt-a.bumpedAt).slice(0,8);
const inSt = (i, st) => st==="Semua" || i.st===st;
const hasAlergi = o => live(o).some(i=>i.alergi);
const kanalLabel = o => o.kanal==="Dine-in" ? "Meja " + o.meja : o.kanal==="Takeaway" ? "Takeaway" + (o.nama ? " · " + o.nama : "") : o.kanal;

function snapshot(o){ S.undo = { oid:o.id, snap: JSON.stringify(o) }; }
function undo(){ if(!S.undo) return null; const o = O(S.undo.oid); Object.assign(o, JSON.parse(S.undo.snap)); S.undo = null; return o; }

const NEXT = { baru:"dimasak", dimasak:"siap", siap:"baru" };
function cycleItem(oid, iid){ const o = O(oid); const i = o.items.find(x=>x.id===iid); if(!i || i.batal) return; i.status = NEXT[i.status]; }
function setItems(o, st, from, to){ live(o).filter(i=>inSt(i,st) && from.includes(i.status)).forEach(i=>i.status = to); }
function startOrder(oid, st){ setItems(O(oid), st, ["baru"], "dimasak"); }
/* Siap: tandai item (stasiun terpilih) siap; pesanan keluar layar hanya bila semua item siap */
function readyOrder(oid, st){ const o = O(oid); snapshot(o); setItems(o, st, ["baru","dimasak"], "siap"); if(orderState(o)==="siap") bump(oid); return o; }
function bump(oid){ const o = O(oid); o.bumpedAt = now(); o.recalled = false; }
function recall(oid){ const o = O(oid); o.bumpedAt = null; o.recalled = true; }
function advanceGroup(refs){ refs.forEach(([oid,iid])=>{ const i = O(oid).items.find(x=>x.id===iid); if(i.status!=="siap") i.status = NEXT[i.status]; }); }
function driverArrives(){ const c = active().filter(o=>isOjol(o) && !o.driverAt); if(c.length){ c[0].driverAt = now(); return c[0]; } return null; }

  const n = 1 + Math.floor(Math.random()*4), items = [];
  for(let k=0;k<n;k++){ const m = pick(MENU); items.push(mkItem(m.name, 1+Math.floor(Math.random()*2), {varian: m.var ? pick(m.var) : null, addons: m.add && Math.random()<.4 ? [pick(m.add)] : []})); }
  if(Math.random()<.25) items[0].catatan = pick(["Tanpa bawang","Sambal dipisah","Kuah dipisah"]);
  const o = mkOrder(S.nextNo++, kanal, extra, items); S.orders.push(o); return o;
}

/* ===== Variasi B: per item, dikelompokkan per stasiun ===== */
function groups(st){
  const map = new Map();
  active().forEach(o=>live(o).filter(i=>i.st===st && i.status!=="siap").forEach(i=>{
    const key = [i.status,i.name,i.varian,i.addons.join("+"),i.catatan,i.alergi,i.alergi||i.catatan?o.id:""].join("|");
    if(!map.has(key)) map.set(key,{status:i.status,name:i.name,varian:i.varian,addons:i.addons,catatan:i.catatan,alergi:i.alergi,qty:0,refs:[],oldest:o.created});
    const g = map.get(key); g.qty += i.qty; g.refs.push({o,i}); g.oldest = Math.min(g.oldest,o.created);
  }));
  return [...map.values()].sort((a,b)=>(b.alergi?1:0)-(a.alergi?1:0) || a.oldest-b.oldest);
}
function aggRow(g, gi, st){
  const sub = [g.varian, ...g.addons.map(a=>"+ "+a)].filter(Boolean).join(" · ");

function go(d){ vi = (vi+d+VARIANTS.length)%VARIANTS.length; history.replaceState(null,"","#"+VARIANTS[vi][0]); render(); }

const A = {
  item: d => { cycleItem(d.o, d.i); render(); },
  start: d => { startOrder(d.o, d.all ? "Semua" : S.st); render(); },
  ready: d => { const o = readyOrder(d.o, d.all ? "Semua" : S.st); render(); toast(o.bumpedAt ? `Pesanan #${o.no} selesai` : `Item ${S.st} pesanan #${o.no} siap`, true); },
  bump: d => { const o = O(d.o); snapshot(o); bump(d.o); render(); toast(`Pesanan #${o.no} diserahkan`, true); },
  grp: d => { advanceGroup(d.refs.split(",").map(x=>x.split(":"))); render(); },
  recall: d => { recall(d.o); const o = O(d.o); S.drawer = false; render(); toast(`Pesanan #${o.no} dibuka kembali`); },
  undo: () => { const o = undo(); document.getElementById("toast").hidden = true; if(o){ render(); } },
  st: d => { S.st = d.st; render(); },
  drawer: () => { S.drawer = true; render(); const c = document.getElementById("dclose"); c && c.focus(); },
  close: () => { S.drawer = false; render(); const b = document.querySelector('[data-key="drawer"]'); b && b.focus(); },
  focus: d => { const el = document.querySelector(`[aria-label="Pesanan ${O(d.o).no}"]`); if(el){ el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"}); const b = el.querySelector("button:not(:disabled)"); b && b.focus({preventScroll:true}); } },
  rand: () => { if(!S.online){ toast("Offline: pesanan baru hanya keluar di printer dapur"); return; } const o = addRandomOrder(); render(); toast(`Pesanan baru #${o.no} · ${kanalLabel(o)}`); },
  driver: () => { const o = driverArrives(); render(); toast(o ? `Driver ${o.kanal} tiba untuk ${o.kode}` : "Semua pesanan ojol sudah ditunggu driver"); },
  ff: () => { S.offset += 5*60000; render(); toast("Waktu dimajukan 5 menit"); },
  net: () => { S.online = !S.online; render(); },
};
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if(!el || el.disabled) return; const f = A[el.dataset.act]; f && f(el.dataset); });
document.addEventListener("keydown", e => {
  const t = e.target; if(t.closest && t.closest("input,textarea,select,[contenteditable]")) return;
  if(S.drawer){ if(e.key==="Escape") A.close(); return; }
  if(e.key==="ArrowLeft") go(-1); if(e.key==="ArrowRight") go(1);
});
/* Detak 1 detik: perbarui pengatur waktu di tempat; render ulang hanya bila status terlambat berubah */
setInterval(() => {
  if(signature() !== sig){ render(); return; }
  document.querySelectorAll("[data-since]").forEach(el => el.textContent = fmt(now() - Number(el.dataset.since)));
  const c = document.querySelector("[data-clock]"); if(c) c.textContent = clock();
}, 1000);
render();
(function(){/* Pemilih palet warna (prototipe) */
  const P=[["hangat","Oranye hangat (ala Toast POS)","linear-gradient(135deg,#e5480b,#ffb020)"],["limau","Hijau limau (ala Wise)","linear-gradient(135deg,#163300,#9fe870)"],["indigo","Indigo cyan (ala Stripe)","linear-gradient(135deg,#635bff,#00d4ff)"],["polos","Polos (versi sebelumnya)","linear-gradient(135deg,#127a5f,#e3f2ec)"]];
  let cur="hangat";try{const s=localStorage.getItem("lifestore-palet");if(P.some(p=>p[0]===s))cur=s}catch(e){}
  const nav=document.createElement("div");nav.className="palet";nav.setAttribute("role","group");nav.setAttribute("aria-label","Pilih palet warna");
  const set=k=>{cur=k;document.documentElement.dataset.palette=k;try{localStorage.setItem("lifestore-palet",k)}catch(e){}nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.p===k)))};
  P.forEach(([k,t,g])=>{const b=document.createElement("button");b.type="button";b.dataset.p=k;b.title=t;b.setAttribute("aria-label",t);b.style.background=g;b.addEventListener("click",()=>set(k));nav.appendChild(b)});
  if(document.querySelector(".topstrip"))nav.classList.add("atas");document.body.appendChild(nav);set(cur);
})();
</script>
